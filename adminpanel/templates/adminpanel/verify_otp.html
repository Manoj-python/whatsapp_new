<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow p-4" style="width: 400px;">
            <h4 class="text-center mb-3">📩 Verify OTP</h4>
            <p class="text-muted text-center small">Enter the 6-digit code sent to your WhatsApp</p>

            <!-- Display error/success messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show py-2" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="otp" class="form-label">OTP Code</label>
                    <input type="text" class="form-control text-center" id="otp" name="otp" placeholder="Enter 6-digit OTP" maxlength="6" required style="font-size: 24px; letter-spacing: 4px;">
                </div>

                <button type="submit" class="btn btn-success w-100">Verify OTP ✅</button>
            </form>

            <hr>
            <p class="text-center mt-2">
                <a href="{% url 'forgot_password' %}" class="text-decoration-none">← Request New OTP</a>
            </p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
