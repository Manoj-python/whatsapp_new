{% extends "adminpanel/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Edit User: {{ user.username }}</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
        </div>
        <div class="mb-3">
            <label>Password (leave blank to keep current)</label>
            <input type="password" name="password" class="form-control">
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" value="{{ user.email }}">
        </div>
        <div class="mb-3">
            <label>Display Name</label>
            <input type="text" name="name" class="form-control" value="{{ user_agent.name|default:'' }}">
        </div>
        <div class="mb-3">
            <label>Mobile</label>
            <input type="text" name="mobile" class="form-control" value="{{ user_agent.mobile|default:'' }}">
        </div>
        <div class="mb-3">
            <label>Role</label>
            <select name="role" class="form-select">
                {% for value, label in role_choices %}
                    <option value="{{ value }}" {% if user_agent and user_agent.role == value %}selected{% endif %}>
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Groups (always visible) -->
        <div class="mb-3">
            <label>Groups (Departments)</label>
            <select name="groups" id="groupsSelect" multiple class="form-select" size="4">
                {% for group in groups %}
                    <option value="{{ group.id }}" {% if user_agent and group in user_agent.groups.all %}selected{% endif %}>
                        {{ group.name }}
                    </option>
                {% endfor %}
            </select>
            <div class="form-text">Hold Ctrl/Cmd to select multiple</div>
        </div>

        <!-- Subgroups (filtered by selected groups) -->
        <div class="mb-3">
            <label>Subgroups</label>
            <select name="subgroups" id="subgroupsSelect" multiple class="form-select" size="4">
                {% for subgroup in subgroups %}
                    <option value="{{ subgroup.id }}" data-parent-group="{{ subgroup.group.name }}"
                        {% if user_agent and subgroup in user_agent.subgroup.all %}selected{% endif %}>
                        {{ subgroup.name }} ({{ subgroup.group.name }})
                    </option>
                {% endfor %}
            </select>
            <div class="form-text">Hold Ctrl/Cmd to select multiple. Only subgroups of selected groups will appear.</div>
        </div>

        <!-- Permissions Section -->
<div class="mb-3">
    <label class="form-label"><i class="fas fa-lock"></i> Permissions</label>
    <div class="form-check">
        <input class="form-check-input" type="checkbox" name="can_edit" id="canEdit" {% if user_agent and user_agent.can_edit %}checked{% endif %}>
        <label class="form-check-label" for="canEdit">Can Edit Cases</label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="checkbox" name="can_resolve" id="canResolve" {% if user_agent and user_agent.can_resolve %}checked{% endif %}>
        <label class="form-check-label" for="canResolve">Can Resolve Cases</label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="checkbox" name="can_close" id="canClose" {% if user_agent and user_agent.can_close %}checked{% endif %}>
        <label class="form-check-label" for="canClose">Can Close Cases</label>
    </div>
</div>

        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{% url 'admin_user_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const groupsSelect = document.getElementById('groupsSelect');
        const subgroupsSelect = document.getElementById('subgroupsSelect');
        const subgroupOptions = subgroupsSelect.querySelectorAll('option');

        function filterSubgroups() {
            const selectedGroupNames = [];
            for (let opt of groupsSelect.selectedOptions) {
                selectedGroupNames.push(opt.textContent.trim());
            }

            if (selectedGroupNames.length === 0) {
                subgroupOptions.forEach(opt => {
                    opt.style.display = 'none';
                    opt.selected = false;
                });
                return;
            }

            subgroupOptions.forEach(opt => {
                const parentGroup = opt.dataset.parentGroup.trim();
                if (selectedGroupNames.includes(parentGroup)) {
                    opt.style.display = '';
                } else {
                    opt.style.display = 'none';
                    opt.selected = false;
                }
            });
        }

        groupsSelect.addEventListener('change', filterSubgroups);
        filterSubgroups(); // Run initial filter
    });
</script>
{% endblock %}
