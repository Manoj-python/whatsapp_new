{% extends "adminpanel/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Create New User</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control">
        </div>
        <div class="mb-3">
            <label>Display Name</label>
            <input type="text" name="name" class="form-control">
        </div>
        <div class="mb-3">
            <label>Mobile</label>
            <input type="text" name="mobile" class="form-control">
        </div>
        <div class="mb-3">
            <label>Role</label>
            <select name="role" class="form-select">
                {% for value, label in role_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Groups (always visible) -->
        <div class="mb-3">
            <label>Groups (Departments)</label>
            <select name="groups" id="groupsSelect" multiple class="form-select" size="4">
                {% for group in groups %}
                    <option value="{{ group.id }}">{{ group.name }}</option>
                {% endfor %}
            </select>
            <div class="form-text">Hold Ctrl/Cmd to select multiple</div>
        </div>

        <!-- Subgroups (filtered by selected groups) -->
        <div class="mb-3">
            <label>Subgroups</label>
            <select name="subgroups" id="subgroupsSelect" multiple class="form-select" size="4">
                {% for subgroup in subgroups %}
                    <option value="{{ subgroup.id }}" data-parent-group="{{ subgroup.group.name }}">
                        {{ subgroup.name }} ({{ subgroup.group.name }})
                    </option>
                {% endfor %}
            </select>
            <div class="form-text">Hold Ctrl/Cmd to select multiple. Only subgroups of selected groups will appear.</div>
        </div>
        <!-- Permissions Section -->
<div class="mb-3">
    <label class="form-label"><i class="fas fa-lock"></i> Permissions</label>
    <div class="form-check">
        <input class="form-check-input" type="checkbox" name="can_edit" id="canEdit">
        <label class="form-check-label" for="canEdit">Can Edit Cases</label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="checkbox" name="can_resolve" id="canResolve">
        <label class="form-check-label" for="canResolve">Can Resolve Cases</label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="checkbox" name="can_close" id="canClose">
        <label class="form-check-label" for="canClose">Can Close Cases</label>
    </div>
</div>

        <button type="submit" class="btn btn-primary">Create</button>
        <a href="{% url 'admin_user_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const groupsSelect = document.getElementById('groupsSelect');
        const subgroupsSelect = document.getElementById('subgroupsSelect');
        const subgroupOptions = subgroupsSelect.querySelectorAll('option');

        function filterSubgroups() {
            // Get selected group names (trimmed)
            const selectedGroupNames = [];
            for (let opt of groupsSelect.selectedOptions) {
                selectedGroupNames.push(opt.textContent.trim());
            }

            // If no groups selected, hide all subgroups and deselect them
            if (selectedGroupNames.length === 0) {
                subgroupOptions.forEach(opt => {
                    opt.style.display = 'none';
                    opt.selected = false;
                });
                return;
            }

            // Show only subgroups whose parent group is in selectedGroupNames
            subgroupOptions.forEach(opt => {
                const parentGroup = opt.dataset.parentGroup.trim();
                if (selectedGroupNames.includes(parentGroup)) {
                    opt.style.display = '';
                } else {
                    opt.style.display = 'none';
                    opt.selected = false;
                }
            });
        }

        // Attach change event
        groupsSelect.addEventListener('change', filterSubgroups);

        // Run initial filter on page load
        filterSubgroups();
    });
</script>
{% endblock %}
