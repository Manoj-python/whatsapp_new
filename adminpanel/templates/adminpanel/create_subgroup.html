{% extends "adminpanel/base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">🔗 Create Subgroup</h4>
                </div>
                <div class="card-body">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="name" class="form-label">Subgroup Name</label>
                            <input type="text" class="form-control" id="name" name="name" 
                                   placeholder="Enter subgroup name (e.g. Team A, North Region)" required>
                            <div class="form-text">Subgroups are finer divisions within a group.</div>
                        </div>
                        <div class="mb-3">
                            <label for="group" class="form-label">Parent Group</label>
                            <select class="form-select" id="group" name="group" required>
                                <option value="">-- Select a Group --</option>
                                {% for group in groups %}
                                    <option value="{{ group.id }}">{{ group.name }}</option>
                                {% endfor %}
                            </select>
                            <div class="form-text">The subgroup will be linked to this parent group.</div>
                        </div>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Create Subgroup</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
