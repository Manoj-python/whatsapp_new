<!-- ============================================================ -->
<!-- CASE VIEW MODAL                                               -->
<!-- ============================================================ -->
<div class="modal fade" id="caseModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="fas fa-folder-open"></i> Case Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="caseModalBody">
                <div class="text-center"><div class="spinner-border"></div><p>Loading...</p></div>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- ESCALATE MODAL                                                -->
<!-- ============================================================ -->
<div class="modal fade" id="escalateModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title"><i class="fas fa-arrow-up"></i> Escalate Case</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="escalateCaseId">
                <div class="mb-3">
                    <label>Escalate To:</label>
                    <select id="escalateLevel" class="form-select"></select>
                </div>
                <div class="mb-3">
                    <label>Loan Number (update if needed)</label>
                    <input type="text" id="escalateLoanNumber" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Reason for Escalation:</label>
                    <textarea id="escalateReason" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-warning" onclick="submitEscalation()">Escalate</button>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- RESOLVE MODAL                                                 -->
<!-- ============================================================ -->
<div class="modal fade" id="resolveModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="fas fa-check-circle"></i> Resolve Case</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="resolveCaseId">
                <div class="mb-3">
                    <label>Resolution Notes:</label>
                    <textarea id="resolutionNotes" class="form-control" rows="4"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" onclick="submitResolution()">Resolve Case</button>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- EDIT CASE MODAL (with Group & Subgroup)                      -->
<!-- ============================================================ -->
<div class="modal fade" id="editCaseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-secondary text-white">
                <h5 class="modal-title"><i class="fas fa-edit"></i> Edit Case</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editCaseId">
                <div class="mb-3">
                    <label>Loan Number</label>
                    <input type="text" id="editLoanNumber" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Customer Name</label>
                    <input type="text" id="editCustomerName" class="form-control">
                </div>
                <!-- Group dropdown -->
                <div class="mb-3">
                    <label>Department (Group)</label>
                    <select id="editGroup" class="form-select">
                        <option value="">-- Select --</option>
                        {% for group in all_groups %}
                        <option value="{{ group.id }}">{{ group.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <!-- Subgroup dropdown -->
                <div class="mb-3">
                    <label>Subgroup</label>
                    <select id="editSubgroup" class="form-select">
                        <option value="">-- Select Subgroup (optional) --</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Issue Description</label>
                    <textarea id="editIssueDescription" class="form-control" rows="4"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitEdit()">Save Changes</button>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="descriptionHistoryModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title"><i class="fas fa-file-alt"></i> Description History</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="descriptionHistoryBody">
                <div class="text-center py-4"><div class="spinner-border"></div><p>Loading...</p></div>
            </div>
        </div>
    </div>
</div>
<!-- ============================================================ -->
<!-- JAVASCRIPT – Shared Functions (must be included after modal HTML) -->
<!-- ============================================================ -->
<script>
    // ─── Fallback if agentPermissions is not defined ─────────────
    if (typeof agentPermissions === 'undefined') {
        var agentPermissions = {
            can_edit: false,
            can_resolve: false,
            can_close: false
        };
    }


    // ─── App parameter helper ───────────────────────────────────
    const urlParams = new URLSearchParams(window.location.search);
    const currentApp = urlParams.get('app') || 'psf';
    function addAppParam(url) {
        const separator = url.includes('?') ? '&' : '?';
        return `${url}${separator}app=${currentApp}`;
    }

    // ─── Escape HTML ────────────────────────────────────────────
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ─── Subgroups data ──────────────────────────────────────────
    let allSubgroups = [];
    let originalGroupId = null;
    let originalSubgroupId = null;

    async function fetchSubgroups() {
        try {
            const resp = await fetch('/messaging2/api/subgroups/');
            const data = await resp.json();
            allSubgroups = data.subgroups || [];
        } catch(e) { console.error('Failed to load subgroups', e); allSubgroups = []; }
    }

    function populateSubgroups(groupId, selectedSubgroupId) {
        const subgroupSelect = document.getElementById('editSubgroup');
        subgroupSelect.innerHTML = '<option value="">-- Select Subgroup (optional) --</option>';
        allSubgroups.forEach(s => {
            if (!groupId || s.group_id == groupId) {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = `${s.name} (${s.group_name})`;
                if (selectedSubgroupId && s.id == selectedSubgroupId) {
                    opt.selected = true;
                }
                subgroupSelect.appendChild(opt);
            }
        });
    }

    // ─── VIEW CASE ──────────────────────────────────────────────
    let currentCaseData = null;

    function viewCase(caseId) {
        $('#caseModal').modal('show');
        document.getElementById('caseModalBody').innerHTML = '<div class="text-center"><div class="spinner-border"></div><p>Loading...</p></div>';

        fetch(addAppParam(`/messaging2/case/${caseId}/detail/`))
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    renderCaseDetail(data.case);
                } else {
                    document.getElementById('caseModalBody').innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                }
            })
            .catch(error => {
                document.getElementById('caseModalBody').innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            });
    }

    function renderCaseDetail(caseData) {
        currentCaseData = caseData;
        const levelBadges = { 'ESC1':'primary','ESC2':'warning','ESC3':'info','ESC4':'danger','ESC5':'dark','RESOLVED':'success','CLOSED':'secondary' };

        const html = `
            <div class="row">
                <div class="col-md-6">
                    <h6><i class="fas fa-info-circle"></i> Case Information</h6>
                    <table class="table table-sm">
                        <tr><th>Case ID:</th><td><strong>${escapeHtml(caseData.case_id)}</strong></td></tr>
                        <tr><th>Customer:</th><td>${escapeHtml(caseData.customer_name || 'N/A')}</td></tr>
                        <tr><th>Mobile:</th><td>${caseData.mobile}</td></tr>
                        <tr><th>Loan Number:</th><td>${caseData.loan_number || '-'}</td></tr>
                        <tr><th>Loan Number:</th><td>${caseData.vehicle_number || '-'}</td></tr>
                        <tr><th>Department:</th><td>${caseData.group_name || 'Not assigned'}</td></tr>
                        <tr><th>Subgroup:</th><td>${caseData.subgroup_name || 'None'}</td></tr>
                        <tr><th>Current Level:</th><td><span class="badge bg-${levelBadges[caseData.current_level]}">${caseData.current_level}</span></td></tr>
                        <tr><th>Status:</th><td><span class="badge bg-${caseData.status === 'Resolved' ? 'success' : 'primary'}">${caseData.status}</span></td></tr>
                    </table>
                </div>
                <div class="col-md-6">
                    <h6><i class="fas fa-users"></i> Assignment</h6>
                    <table class="table table-sm">
                        <tr><th>Assigned To:</th><td>${caseData.assigned_to_name || 'Unassigned'}</td></tr>
                        <tr><th>Created By:</th><td>${caseData.created_by || 'System'}</td></tr>
                        <tr><th>Created At:</th><td>${new Date(caseData.created_at).toLocaleString()}</td></tr>
                        ${caseData.resolved_at ? `<tr><th>Resolved At:</th><td>${new Date(caseData.resolved_at).toLocaleString()}<br><small>By: ${caseData.resolved_by} (${caseData.resolved_by_role}) at ${caseData.resolved_at_level}</small></td>` : ''}
                    </table>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <h6><i class="fas fa-file-alt"></i> Issue Description</h6>
                    <div class="border rounded p-3 bg-light">${escapeHtml(caseData.issue_description || 'No description')}</div>
                </div>
            </div>
            ${caseData.resolution_notes ? `
            <div class="row mt-3">
                <div class="col-12">
                    <h6><i class="fas fa-check-circle"></i> Resolution Notes</h6>
                    <div class="border rounded p-3 bg-light">${escapeHtml(caseData.resolution_notes)}</div>
                </div>
            </div>` : ''}
            <div class="row mt-3">
                <div class="col-12">
                    <h6><i class="fas fa-history"></i> Escalation Timeline</h6>
                    <div id="timelineContent" class="border rounded p-3" style="max-height:300px; overflow-y:auto;">Loading...</div>
                </div>
            </div>
             <div class="row mt-3">
                <div class="col-12 text-center">
                    <button class="btn btn-outline-info btn-sm" onclick="viewDescriptionHistory('${caseData.case_id}')">
                        <i class="fas fa-file-alt"></i> View Description History
                    </button>
                </div>
            </div>
        
        `;
        document.getElementById('caseModalBody').innerHTML = html;
        loadTimeline(caseData.case_id);

        // Populate escalate modal
        const allLevels = ['ESC1','ESC2','ESC3','ESC4','ESC5'];
        const currentIdx = allLevels.indexOf(caseData.current_level);
        const higherLevels = allLevels.slice(currentIdx + 1);
        const levelNames = { 'ESC1':'Normal (ESC1)', 'ESC2':'Executive (ESC2)', 'ESC3':'Manager (ESC3)', 'ESC4':'Head (ESC4)', 'ESC5':'Admin (ESC5)' };
        let options = '';
        higherLevels.forEach(lvl => { options += `<option value="${lvl}">${levelNames[lvl]}</option>`; });
        document.getElementById('escalateLevel').innerHTML = options || '<option disabled>No higher levels available</option>';
    }


     function viewDescriptionHistory(caseId) {
        if (!caseId) {
            showNotification('No case ID provided', 'error');
            return;
        }

        const modalElement = document.getElementById('descriptionHistoryModal');
        if (!modalElement) {
            showNotification('Modal not found', 'error');
            return;
        }

        // Show modal using Bootstrap 5 API
        if (typeof bootstrap !== 'undefined' && bootstrap.Modal) {
            const modal = new bootstrap.Modal(modalElement);
            modal.show();
        } else {
            // Fallback
            modalElement.classList.add('show');
            modalElement.style.display = 'block';
            document.body.classList.add('modal-open');
            const backdrop = document.createElement('div');
            backdrop.className = 'modal-backdrop fade show';
            document.body.appendChild(backdrop);
        }

        const body = document.getElementById('descriptionHistoryBody');
        body.innerHTML = '<div class="text-center py-4"><div class="spinner-border"></div><p>Loading...</p></div>';

        fetch(addAppParam(`/messaging2/case/${caseId}/description-history/`))
            .then(res => res.json())
            .then(data => {
                if (data.success && data.logs.length > 0) {
                    let html = '<div class="timeline">';
                    // Show all logs (already ordered by changed_at descending from backend)
                    data.logs.forEach(log => {
                        html += `
                            <div class="border-bottom pb-3 mb-3">
                                <small class="text-muted">${new Date(log.changed_at).toLocaleString()}</small>
                                <div><strong>Level:</strong> ${log.level}</div>
                                <div><strong>Updated By:</strong> ${escapeHtml(log.changed_by)}</div>
                                <div class="mt-2 p-2 bg-light rounded">
                                    <strong>Description:</strong> ${escapeHtml(log.new_description)}
                                </div>
                                ${log.previous_description ? `<div class="small text-muted mt-1">Previous: ${escapeHtml(log.previous_description)}</div>` : ''}
                            </div>
                        `;
                    });
                    html += '</div>';
                    body.innerHTML = html;
                } else {
                    body.innerHTML = '<div class="alert alert-info">No description history available.</div>';
                }
            })
            .catch(err => {
                body.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
            });
    }


    function loadTimeline(caseId) {
        fetch(addAppParam(`/messaging2/case/${caseId}/timeline/`))
            .then(response => response.json())
            .then(data => {
                const html = data.logs.map(log => `
                    <div class="border-bottom pb-2 mb-2">
                        <small>${new Date(log.created_at).toLocaleString()}</small>
                        <div><span class="badge bg-secondary">${log.from_level}</span> → <span class="badge bg-primary">${log.to_level}</span></div>
                        <div><strong>By:</strong> ${log.escalated_by || 'System'}</div>
                        ${log.reason ? `<div class="small text-muted">${escapeHtml(log.reason)}</div>` : ''}
                    </div>
                `).join('');
                document.getElementById('timelineContent').innerHTML = html || '<div class="text-muted">No timeline history</div>';
            })
            .catch(error => {
                document.getElementById('timelineContent').innerHTML = `<div class="alert alert-danger">Error loading timeline</div>`;
            });
    }

    // ─── ESCALATE ─────────────────────────────────────────────────
    function escalateCase(caseId) {
        document.getElementById('escalateCaseId').value = caseId;
        document.getElementById('escalateReason').value = '';

        fetch(addAppParam(`/messaging2/case/${caseId}/detail/`))
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const caseData = data.case;
                    document.getElementById('escalateLoanNumber').value = caseData.loan_number || '';
                    // Populate levels
                    const allLevels = ['ESC1','ESC2','ESC3','ESC4','ESC5'];
                    const currentIdx = allLevels.indexOf(caseData.current_level);
                    const higherLevels = allLevels.slice(currentIdx + 1);
                    const levelNames = { 'ESC1':'Normal (ESC1)', 'ESC2':'Executive (ESC2)', 'ESC3':'Manager (ESC3)', 'ESC4':'Head (ESC4)', 'ESC5':'Admin (ESC5)' };
                    let options = '';
                    higherLevels.forEach(lvl => { options += `<option value="${lvl}">${levelNames[lvl]}</option>`; });
                    document.getElementById('escalateLevel').innerHTML = options || '<option disabled>No higher levels available</option>';
                } else {
                    alert('Could not load case details');
                }
            })
            .catch(error => {
                console.error(error);
                alert('Error loading case details');
            });

        $('#escalateModal').modal('show');
    }

    function submitEscalation() {
        const caseId = document.getElementById('escalateCaseId').value;
        const newLevel = document.getElementById('escalateLevel').value;
        const reason = document.getElementById('escalateReason').value;
        const loan = document.getElementById('escalateLoanNumber').value;

        if (!newLevel) { alert('Please select escalation level'); return; }
        if (!reason) { alert('Please provide a reason'); return; }

        fetch(addAppParam(`/messaging2/case/${caseId}/escalate/`), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
            body: JSON.stringify({ new_level: newLevel, reason: reason, loan: loan, name: '' })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Case escalated successfully!');
                $('#escalateModal').modal('hide');
                location.reload();
            } else {
                alert('Error: ' + data.error);
            }
        })
        .catch(error => alert('Error: ' + error.message));
    }

    // ─── RESOLVE ──────────────────────────────────────────────────
    function resolveCase(caseId) {
        if (!agentPermissions.can_resolve) {
            alert('You do not have permission to resolve cases.');
            return;
        }
        document.getElementById('resolveCaseId').value = caseId;
        $('#resolveModal').modal('show');
    }

    function submitResolution() {
        const caseId = document.getElementById('resolveCaseId').value;
        const notes = document.getElementById('resolutionNotes').value;
        if (!notes) { alert('Please provide resolution notes'); return; }

        fetch(addAppParam(`/messaging2/case/${caseId}/resolve/`), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
            body: JSON.stringify({ resolution_notes: notes })
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => {
                    throw new Error(`Server returned ${response.status} - ${text.substring(0, 200)}`);
                });
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                alert('Case resolved successfully!');
                $('#resolveModal').modal('hide');
                location.reload();
            } else {
                alert('Error: ' + data.error);
            }
        })
        .catch(error => alert('Error: ' + error.message));
    }

    // ─── EDIT CASE (with Subgroup) ──────────────────────────────
    function editCase(caseId) {
        if (!agentPermissions.can_edit) {
            alert('You do not have permission to edit cases.');
            return;
        }
        document.getElementById('editCaseId').value = caseId;
        $('#editCaseModal').modal('show');

        // Fetch case details
        fetch(addAppParam(`/messaging2/case/${caseId}/detail/`))
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const c = data.case;
                    document.getElementById('editLoanNumber').value = c.loan_number || '';
                    document.getElementById('editCustomerName').value = c.customer_name || '';
                    document.getElementById('editIssueDescription').value = c.issue_description || '';

                    const groupSelect = document.getElementById('editGroup');
                    if (c.group_id) {
                        groupSelect.value = c.group_id;
                    } else {
                        groupSelect.value = '';
                    }

                    // Store original IDs for change detection
                    originalGroupId = c.group_id || null;
                    originalSubgroupId = c.subgroup_id || null;

                    // Fetch subgroups if not loaded
                    if (allSubgroups.length === 0) {
                        fetchSubgroups().then(() => {
                            populateSubgroups(c.group_id, c.subgroup_id);
                        });
                    } else {
                        populateSubgroups(c.group_id, c.subgroup_id);
                    }

                    // Filter subgroups when group changes
                    groupSelect.onchange = function() {
                        const selectedGroupId = this.value;
                        populateSubgroups(selectedGroupId, null);
                    };

                } else {
                    alert('Could not load case data for editing.');
                }
            })
            .catch(error => {
                alert('Error loading case: ' + error.message);
            });
    }

    function submitEdit() {
        const caseId = document.getElementById('editCaseId').value;
        const loanNumber = document.getElementById('editLoanNumber').value.trim();
        const customerName = document.getElementById('editCustomerName').value.trim();
        const issueDescription = document.getElementById('editIssueDescription').value.trim();
        const group = document.getElementById('editGroup').value;
        const subgroup = document.getElementById('editSubgroup').value;

        if (!loanNumber || !customerName || !issueDescription) {
            alert('Please fill in all fields.');
            return;
        }

        // Optional: warn if group changed
        if (originalGroupId && group && group != originalGroupId) {
            if (!confirm('Changing the department will re‑assign the case to an available agent in that department. Continue?')) {
                return;
            }
        }

        if (!csrftoken) {
            alert('CSRF token missing. Please refresh the page.');
            return;
        }

        const payload = {
            loan_number: loanNumber,
            customer_name: customerName,
            issue_description: issueDescription
        };
        if (group) {
            payload.group = group;
        }
        if (subgroup) {
            payload.subgroup = subgroup;
        }

        fetch(addAppParam(`/messaging2/case/${caseId}/edit/`), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => {
                    throw new Error(`Server returned ${response.status} - ${text.substring(0, 200)}`);
                });
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                alert('Case updated successfully!');
                $('#editCaseModal').modal('hide');
                location.reload();
            } else {
                alert('Error: ' + data.error);
            }
        })
        .catch(error => {
            alert('Error: ' + error.message);
        });
    }

    // ─── CLOSE CASE (if needed) ──────────────────────────────────
    function closeCase(caseId) {
        if (!agentPermissions.can_close) {
            alert('You do not have permission to close cases.');
            return;
        }
        const reason = prompt("Enter reason for closing this case (optional):");
        if (reason === null) return;

        fetch(addAppParam(`/adminpanel/case/${caseId}/close/`), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
            body: JSON.stringify({ close_reason: reason || "" })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert('Case closed successfully!');
                location.reload();
            } else {
                alert('Error: ' + data.error);
            }
        })
        .catch(err => alert('Error: ' + err.message));
    }
</script>
