<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SPL Cases - WhatsApp Chat Dashboard</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --whatsapp-green: #25D366;
      --whatsapp-dark: #075E54;
      --whatsapp-teal: #128C7E;
      --chat-bg: #E5DDD5;
      --sent-bubble: #DCF8C6;
      --received-bubble: #FFFFFF;
      --sidebar-bg: #F0F2F5;
      --esc1: #4caf50;
      --esc2: #2196f3;
      --esc3: #ff9800;
      --esc4: #9c27b0;
      --esc5: #f44336;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--chat-bg);
      height: 100vh;
      overflow: hidden;
    }

    .chat-container {
      display: flex;
      height: 100vh;
      background: var(--sidebar-bg);
      overflow: hidden;
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 380px;
      background: white;
      border-right: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: transform 0.3s ease;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1000;
        transform: translateX(0);
      }
      .sidebar.hide {
        transform: translateX(-100%);
      }
      .chat-area {
        width: 100%;
      }
    }

    /* Sidebar Header */
    .sidebar-header {
      padding: 16px;
      background: var(--whatsapp-dark);
      color: white;
      flex-shrink: 0;
    }

    /* Header Top Row */
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .header-top h4 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-badge {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: white;
    }

    /* User Info Single Line - Compact */
    .user-info-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }

    .esc-badge-compact {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.15);
      padding: 4px 12px;
      border-radius: 30px;
    }

    .esc-number {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: white;
    }

    .esc-number.level-1 { background: #4caf50; }
    .esc-number.level-2 { background: #2196f3; }
    .esc-number.level-3 { background: #ff9800; }
    .esc-number.level-4 { background: #9c27b0; }
    .esc-number.level-5 { background: #f44336; }

    .role-name {
      font-size: 12px;
      font-weight: 500;
      color: white;
    }

    .user-name-compact {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255,255,255,0.9);
    }

    .user-name-compact i {
      font-size: 12px;
    }

    /* Search Box */
    .search-box {
      padding: 12px;
      background: white;
      border-bottom: 1px solid #e9ecef;
      flex-shrink: 0;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border: none;
      background: var(--sidebar-bg);
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }

    /* Chat Tabs */
    .chat-tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #e9ecef;
      padding: 0 16px;
      gap: 24px;
    }

    .chat-tab {
      padding: 12px 0;
      font-size: 15px;
      font-weight: 500;
      color: #667781;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .chat-tab.active {
      color: var(--whatsapp-green);
    }

    .chat-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--whatsapp-green);
      border-radius: 3px;
    }

    .chat-tab:hover {
      color: var(--whatsapp-dark);
    }

    .chat-tab .badge {
      background: #dc3545;
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 12px;
      margin-left: 6px;
    }

    /* Contact List */
    .contact-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid #f0f0f0;
      min-height: 72px;
      background: white;
    }

    .contact-item.active {
      background: #e8f0fe;
    }

    .contact-avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: var(--whatsapp-green);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      margin-right: 12px;
      flex-shrink: 0;
      position: relative;
    }

    /* ESC Level Indicator on Avatar */
    .esc-level-indicator {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid white;
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .level-ESC1 { background: var(--esc1); }
    .level-ESC2 { background: var(--esc2); }
    .level-ESC3 { background: var(--esc3); }
    .level-ESC4 { background: var(--esc4); }
    .level-ESC5 { background: var(--esc5); }
    /* Add these to your style section */
.level-RESOLVED { 
    background: #28a745; 
    font-size: 11px;
}
.level-CLOSED { 
    background: #c50d1d; 
    font-size: 11px;
}

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-name {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 4px;
      color: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .contact-last-msg {
      font-size: 13px;
      color: #667781;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-meta {
      text-align: right;
      flex-shrink: 0;
      min-width: 45px;
    }

    .contact-time {
      font-size: 11px;
      color: #667781;
      margin-bottom: 4px;
    }

    .unread-badge {
      background: var(--whatsapp-green);
      color: white;
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      display: inline-block;
      min-width: 20px;
      text-align: center;
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--chat-bg);
      height: 100vh;
      overflow: hidden;
    }

    /* Chat Header */
    .chat-header {
      background: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e9ecef;
      flex-shrink: 0;
    }

    .chat-header-back {
      display: none;
      background: none;
      border: none;
      font-size: 20px;
      margin-right: 12px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
    }

    @media (max-width: 768px) {
      .chat-header-back {
        display: block;
      }
    }

    .chat-header-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--whatsapp-green);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .chat-header-info {
      flex: 1;
    }

    .chat-header-name {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 2px;
    }

    .chat-header-status {
      font-size: 12px;
      color: #667781;
    }

    /* Case Panel Button */
    .case-panel-btn {
      background: linear-gradient(135deg, #4361ee, #3f37c9);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      margin-left: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .case-panel-btn:hover {
      transform: scale(1.05);
    }

    /* Messages */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-row {
      display: flex;
      width: 100%;
      margin-bottom: 4px;
    }

    .message-row.sent {
      justify-content: flex-end;
    }

    .message-row.received {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 70%;
      min-width: 60px;
      padding: 8px 12px;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .message-bubble.sent {
      background: var(--sent-bubble);
      border-bottom-right-radius: 4px;
    }

    .message-bubble.received {
      background: var(--received-bubble);
      border-bottom-left-radius: 4px;
    }

    .message-text {
      font-size: 14px;
      line-height: 1.4;
      color: #111;
    }

    .message-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 4px;
      font-size: 10px;
      color: #667781;
    }

    .message-time {
      font-size: 10px;
    }

    .message-tick {
      font-size: 12px;
      margin-left: 4px;
      display: inline-block;
    }

    .message-tick.sent { color: #8696a0; }
    .message-tick.delivered { color: #25D366; font-weight: bold; }
    .message-tick.read { color: #34B7F1; font-weight: bold; }
    .message-tick.failed { color: #dc3545; }

    .message-image {
      max-width: 250px;
      max-height: 250px;
      border-radius: 8px;
      cursor: pointer;
    }

    .message-video {
      max-width: 250px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Composer */
    .composer {
      background: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #e9ecef;
    }

    .composer-input {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--sidebar-bg);
      border-radius: 24px;
      padding: 8px 16px;
    }

    .composer-input input {
      flex: 1;
      border: none;
      background: none;
      outline: none;
      font-size: 14px;
    }

    .composer button {
      background: var(--whatsapp-green);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
    }

    /* Case Sidebar */
    .case-sidebar {
      width: 350px;
      background: white;
      border-left: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      height: 100vh;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 1001;
    }

    .case-sidebar.show {
      transform: translateX(0);
    }

    .case-sidebar-header {
      padding: 16px;
      background: var(--whatsapp-dark);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .case-sidebar-header h5 {
      margin: 0;
    }

    .close-case-sidebar {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .case-sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* Loading States */
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid var(--whatsapp-green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading, .empty-state {
      text-align: center;
      padding: 40px;
      color: #667781;
    }

    /* Notifications */
    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      z-index: 9999;
      animation: slideInRight 0.3s ease;
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .notification.success { background: var(--whatsapp-green); }
    .notification.error { background: #dc3545; }
    .notification.info { background: #17a2b8; }
    .notification.warning { background: #ff9800; }

    /* Date Separator */
    .date-separator {
      text-align: center;
      margin: 16px 0;
    }

    .date-separator span {
      background: rgba(0,0,0,0.05);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      color: #667781;
    }

    /* Load Older Button */
    .load-older-container {
      display: flex;
      justify-content: center;
      margin: 16px 0;
      cursor: pointer;
    }

    .load-older-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--whatsapp-green);
      color: white;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 500;
    }

    .load-older-btn:hover {
      background: var(--whatsapp-teal);
    }

    /* File Preview */
    .file-preview {
      background: white;
      padding: 8px 20px;
      border-top: 1px solid #e9ecef;
      display: none;
    }

    .file-preview.show {
      display: block;
    }

    .preview-card {
      background: #f8f9fa;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .preview-card i {
      font-size: 24px;
      color: var(--whatsapp-green);
    }

    .preview-info {
      flex: 1;
    }

    .preview-cancel {
      background: none;
      border: none;
      cursor: pointer;
      color: #dc3545;
      font-size: 16px;
      padding: 4px;
    }

    /* Typing Indicator */
    .typing-indicator {
      padding: 8px 20px;
      font-size: 12px;
      color: #667781;
      font-style: italic;
    }

    /* Media Modal */
    .media-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      display: none;
      z-index: 2000;
    }

    .media-modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 2001;
    }

    /* Scrollbars */
    .messages-container::-webkit-scrollbar,
    .contact-list::-webkit-scrollbar {
      width: 6px;
    }

    .messages-container::-webkit-scrollbar-track,
    .contact-list::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    .messages-container::-webkit-scrollbar-thumb,
    .contact-list::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 3px;
    }

    /* Document Bubble */
    .document-bubble {
      max-width: 280px;
      background: #f0f0f0;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .document-bubble:hover {
      background: #e5e5e5;
    }

    .document-content {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
    }

    .document-icon {
      position: relative;
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 10px;
    }

    .document-icon i {
      font-size: 22px;
    }

    .document-details {
      flex: 1;
      min-width: 0;
    }

    .document-filename {
      font-size: 13px;
      font-weight: 500;
      color: #111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .document-download {
      flex-shrink: 0;
      color: #8696a0;
      font-size: 14px;
      padding: 6px;
      border-radius: 50%;
    }

    .document-bubble:hover .document-download i {
      color: var(--whatsapp-green);
    }

    .doc-text {
      margin-top: 6px;
      font-size: 13px;
      color: #111;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .message-bubble { max-width: 85%; min-width: 50px; padding: 6px 10px; }
      .message-image { max-width: 100%; max-height: 200px; }
      .message-video { max-width: 100%; max-height: 200px; }
      .document-bubble { max-width: 100%; min-width: 200px; }
      .composer { padding: 8px 12px; gap: 8px; }
      .composer-input { padding: 6px 12px; }
      .composer button { width: 35px; height: 35px; }
      .chat-header { padding: 10px 15px; }
      .chat-header-avatar { width: 35px; height: 35px; font-size: 14px; }
    }

    @media (max-width: 480px) {
      .message-bubble { max-width: 90%; }
      .message-image { max-height: 180px; }
      .message-video { max-height: 180px; }
      .document-bubble { min-width: 180px; }
      .messages-container { padding: 12px; gap: 8px; }
    }
    /* Message Footer - Name and Time on same line, right-aligned */
.message-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 6px;
    font-size: 10px;
    flex-wrap: wrap;
}

.message-sender {
    font-weight: 600;
    color: #075E54;
    font-size: 10px;
}

.message-time {
    color: #667781;
    font-size: 10px;
}

.message-tick {
    font-size: 11px;
    margin-left: 2px;
}

.message-tick.sent { color: #8696a0; }
.message-tick.delivered { color: #25D366; font-weight: bold; }
.message-tick.read { color: #34B7F1; font-weight: bold; }
.message-tick.failed { color: #dc3545; }

/* For received messages */
.message-row.received .message-sender {
    color: #128C7E;
}
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
  <div class="header-top">
    <h4 onclick="goToDashboard()" style="cursor: pointer;">
    <i class="fab fa-whatsapp"></i> WhatsApp Chats
</h4>
    <span class="esc-number">
            {{ agent.level|default:"ESC1" }}
        </span>
          <span class="role-name" id="roleName">{{ agent.role|default:"Agent" }}</span>


    <div class="user-badge">{{ request.user.username|slice:":2"|upper }}</div>
  </div>
  
</div>
      <div class="chat-tabs">
        <div class="chat-tab active" data-filter="all" onclick="switchTab('all')">All</div>
        <div class="chat-tab" data-filter="unread" onclick="switchTab('unread')">
          Unread
          <span class="badge" id="unreadCountBadge" style="display: none;">0</span>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search contacts..." autocomplete="off">
      </div>
      <div class="contact-list" id="contactList">
        <div class="loading">Loading contacts...</div>
      </div>
    </div>

    <div class="chat-area" id="chatArea" style="display: none;">
      <div class="chat-header">
        <button class="chat-header-back" id="backBtn"><i class="fas fa-arrow-left"></i></button>
        <div class="chat-header-avatar" id="headerAvatar">👤</div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="headerName">Select a chat</div>
          <div class="chat-header-status" id="headerStatus"></div>
        </div>
        <button class="case-panel-btn" id="casePanelBtn" title="View Case Details">
    <i class="fas fa-folder-open"></i>
  </button>
      </div>

      <div class="messages-container" id="messagesContainer">
        <div class="empty-state">Select a contact to start chatting</div>
      </div>

      <div class="typing-indicator" id="typingIndicator" style="display: none;">Typing...</div>

      <div class="composer" style="display: none;">
        <div class="composer-input">
          <button id="attachBtn"><i class="fas fa-paperclip"></i></button>
          <input type="text" id="messageInput" placeholder="Type a message...">
        </div>

    // ============================================
    // WEBSOCKET CONNECTION
    // ============================================
    function showNotification(message, type = 'info') {
      const existing = document.querySelector('.notification');
      if (existing) existing.remove();

      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
      document.body.appendChild(notification);

      setTimeout(() => {
        notification.remove();
      }, 3000);
    }

    async function downloadDocument(url, filename, event) {
      if (event) {
        event.stopPropagation();
      }

      try {
        showNotification(`Downloading ${filename}...`, 'info');

        const response = await fetch(url);
        if (!response.ok) throw new Error('Download failed');

        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(blobUrl);

        showNotification(`Downloaded ${filename} successfully!`, 'success');
      } catch (error) {
        console.error('Download error:', error);
        window.open(url, '_blank');
      }
    }

    function connectWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${scheme}://${location.host}/ws/chat2/`);

      ws.onopen = () => {
        console.log('WebSocket connected');
        reconnectAttempts = 0;
        showNotification('Connected to chat server', 'success');
        lastProcessedPage = 0;
        contactPage = 1;
        contacts = [];
        loadContacts();
      };

      ws.onmessage = (e) => {
        try {
          handleWebSocketMessage(JSON.parse(e.data));
        } catch (err) {
          console.error('WebSocket parse error:', err);
        }
      };

      ws.onclose = () => {
        console.log('WebSocket disconnected');
        showNotification('Disconnected from server, reconnecting...', 'info');

        setTimeout(() => {
          if (reconnectAttempts < 10) {
            reconnectAttempts++;
            connectWebSocket();
          }
        }, 3000);
      };
      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        showNotification('Connection error', 'error');
      };
    }

    function sendWS(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
      } else {
        console.warn('WebSocket not connected');
      }
    }

    // ============================================
    // TAB SWITCH FUNCTION
    // ============================================
    function switchTab(filter) {
      if (currentFilter === filter) return;
      currentFilter = filter;

      document.querySelectorAll('.chat-tab').forEach(tab => {
        if (tab.dataset.filter === filter) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });

      contactPage = 1;
      contacts = [];
      hasMoreContacts = true;
      lastProcessedPage = 0;
      contactListEl.innerHTML = '<div class="loading">Loading contacts...</div>';
      loadContacts();
    }

    // ============================================
    // CONTACTS WITH INFINITE SCROLL
    // ============================================
    function loadContacts(page = 1) {
      if (isLoadingContacts) {
        console.log(`⏭️ Already loading contacts, skipping page ${page}`);
        return;
      }
      if (page <= contactPage && page > 1) {
        console.log(`⏭️ Page ${page} already loaded`);
        return;
      }
      isLoadingContacts = true;
      console.log(`📞 Loading contacts page ${page}`);
      sendWS({ type: 'get_contacts', page: page, filter: currentFilter });
    }

    function searchContacts(query) {
      contactPage = 1;
      contacts = [];
      hasMoreContacts = true;
      lastProcessedPage = 0;
      sendWS({ type: 'search_contacts', q: query, filter: currentFilter });
    }

   function renderContacts(contactsData, replace = true, unreadCount = 0, hasMore = false, currentPage = 1) {
    if (isRenderingContacts) {
        console.log('⏭️ Already rendering, skipping...');
        return;
    }
    isRenderingContacts = true;
    isLoadingContacts = false;

    if (lastProcessedPage === currentPage && !replace) {
        console.log(`⏭️ Skipping duplicate page ${currentPage}`);
        isRenderingContacts = false;
        return;
    }
    lastProcessedPage = currentPage;

    // ============================================
    // CRITICAL: Role-based filtering
    // ============================================
    let filteredContacts = contactsData;
    
    // Debug: See what levels we received
    console.log('📋 Received contacts with levels:', contactsData.map(c => ({mobile: c.mobile, level: c.current_level})));
    
    // Only AGENT and ADMIN see ALL contacts
    if (currentUser.role !== 'AGENT' && currentUser.role !== 'ADMIN') {
        filteredContacts = contactsData.filter(contact => {
            return contact.current_level === currentUser.level;
        });
        console.log(`🔍 ${currentUser.role} (${currentUser.level}) filtered: ${contactsData.length} → ${filteredContacts.length} contacts`);
    }

    if (replace) {
        contacts = filteredContacts;
    } else {
        const existingMobiles = new Set(contacts.map(c => c.mobile));
        const newContacts = filteredContacts.filter(c => !existingMobiles.has(c.mobile));
        contacts = [...contacts, ...newContacts];
        console.log(`📊 Added ${newContacts.length} new contacts, total: ${contacts.length}`);
    }

    totalUnreadCount = unreadCount;
    const badge = document.getElementById('unreadCountBadge');
    if (badge) {
        if (totalUnreadCount > 0) {
            badge.style.display = 'inline';
            badge.textContent = totalUnreadCount;
        } else {
            badge.style.display = 'none';
        }
    }

    if (contacts.length === 0) {
        let emptyMessage = '';

    function isSameDay(date1, date2) {
      return date1.getDate() === date2.getDate() &&
             date1.getMonth() === date2.getMonth() &&
             date1.getFullYear() === date2.getFullYear();
    }

    function formatMessageDate(date) {
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const yesterdayDate = new Date(yesterday.getFullYear(), yesterday.getMonth(), yesterday.getDate());
      const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

      if (msgDate.getTime() === todayDate.getTime()) {
        return 'Today';
      } else if (msgDate.getTime() === yesterdayDate.getTime()) {
        return 'Yesterday';
      } else {
        const options = {
          day: 'numeric',
          month: 'long',
          year: date.getFullYear() !== today.getFullYear() ? 'numeric' : undefined
        };
        return date.toLocaleDateString('en-IN', options);
      }
    }

    function renderMessages(messagesData, hasMore, nextCursorDateParam, isInitial = false) {
      if (messagesData.length === 0 && messages.length === 0) {
        messagesContainer.innerHTML = '<div class="empty-state">No messages yet</div>';
        return;
      }

      hasMoreMessages = hasMore;
      nextCursorDate = nextCursorDateParam;

      console.log(`📊 renderMessages - hasMore: ${hasMore}, nextCursorDate: ${nextCursorDate}, messagesCount: ${messagesData.length}, isInitial: ${isInitial}`);

      const sortedMessages = [...messagesData].sort((a, b) => new Date(a.sent_at) - new Date(b.sent_at));

      let newMessages = [];

      if (isInitial || messages.length === 0) {
        newMessages = sortedMessages;
      } else {
        const existingIds = new Set(messages.map(m => m.message_id || m.id));
        const uniqueNewMessages = sortedMessages.filter(m => !existingIds.has(m.message_id || m.id));
        newMessages = [...uniqueNewMessages, ...messages];
      }

      let lastDate = null;
      let html = '';

      for (const msg of newMessages) {
        const msgDate = new Date(msg.sent_at);
        const currentDateLabel = formatMessageDate(msgDate);

        if (lastDate !== currentDateLabel) {
          html += `<div class="date-separator"><span>${currentDateLabel}</span></div>`;
          lastDate = currentDateLabel;
        }

        html += renderMessage(msg);
      }

      if (isInitial || messages.length === 0) {
        messages = newMessages;
        messagesContainer.innerHTML = html;
        if (hasMoreMessages) {
          addLoadOlderButton();
        } else {
          removeLoadOlderButton();
        }
        scrollToBottom();
      } else {
        const oldScrollHeight = messagesContainer.scrollHeight;
        messages = newMessages;
        messagesContainer.innerHTML = html;
        const newScrollHeight = messagesContainer.scrollHeight;
        messagesContainer.scrollTop = newScrollHeight - oldScrollHeight;
        if (hasMoreMessages) {
          addLoadOlderButton();
        } else {
          removeLoadOlderButton();
        }
      }
      isLoadingMessages = false;
    }

            timeDisplay = sentDate.toLocaleString('en-IN', {
                day: '2-digit',
                month: 'short',
                year: '2-digit',
                hour: '2-digit',
                minute: '2-digit',

    function appendMessage(msg) {
      const wasAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 100;

      let newDateLabel = null;

      if (messages.length > 0) {
        const lastMsg = messages[messages.length - 1];
        const lastMsgDate = new Date(lastMsg.sent_at);
        const newMsgDate = new Date(msg.sent_at);

        if (!isSameDay(lastMsgDate, newMsgDate)) {
          needDateSeparator = true;
          newDateLabel = formatMessageDate(newMsgDate);
        }
      } else {
        needDateSeparator = true;
        newDateLabel = formatMessageDate(new Date(msg.sent_at));

        newHtml = `<div class="date-separator"><span>${newDateLabel}</span></div>`;

      messagesContainer.insertAdjacentHTML('beforeend', newHtml);

    function updateMessageTickImproved(messageId, status) {
      // Ignore fake delivery updates (empty message_id)
if (!messageId || messageId === "") {
    console.warn("⚠️ Ignoring delivery.update with empty message_id (not a real read receipt)");
    return;
}
  console.log(`🔄 Updating tick for messageId: ${messageId}, status: ${status}`);

  // ============================================
  // FOR FAILED/BLOCKED/INVALID STATUSES
  // ============================================
  if (status === 'Failed' || status === 'Blocked' || status === 'Invalid' ||
      status === 'Template Required' || status === 'Template Failed' ||
      status === 'Re-engagement Required' || status === 'Rate Limited' ||
      status === 'Auth Failed') {

    console.log('⚠️ Failed status detected - will update most recent sent message');

    let updatedMessageIndex = -1;

    // Update in messages array (find the most recent sent message without a final status)
    for (let i = messages.length - 1; i >= 0; i--) {
      if (messages[i].message_type === 'Sent' &&
          (messages[i].status === 'Sent' || messages[i].status === 'Pending' ||
           messages[i].status === 'Sending' || messages[i].status === 'Delivered' ||
           messages[i].status === 'Read')) {
        // Skip if already has a final status (Delivered, Read, or Failed)
        if (messages[i].status === 'Delivered' || messages[i].status === 'Read') {
          continue;
        }
        messages[i].status = status;
        if (messageId && messageId !== '') {
          messages[i].message_id = messageId;
        }
        updatedMessageIndex = i;
        console.log(`✅ Updated message at index ${i} to ${status}`);
        break;
      }
    }

    // Find the newest sent message in DOM that can be marked as failed
    const sentMessages = document.querySelectorAll('.message-row.sent');
    let updated = false;

    for (let i = sentMessages.length - 1; i >= 0; i--) {
      const tick = sentMessages[i].querySelector('.message-tick');
      // Only update if it doesn't already have a final status
      if (tick && !tick.classList.contains('delivered') &&
          !tick.classList.contains('read') &&
          !tick.classList.contains('failed')) {

        // Update this one - it's the failed message
        tick.innerHTML = '❌';
        tick.className = 'message-tick failed';
        tick.style.color = '#dc3545';
        tick.style.fontSize = '12px';
        tick.style.fontWeight = 'bold';
        tick.title = status;

        // Add shake animation
        tick.style.animation = 'none';
        tick.offsetHeight;
        tick.style.animation = 'shake 0.3s ease-in-out';

        // Store the message ID if we have it
        if (messageId && messageId !== '') {
          tick.setAttribute('data-msg-id', messageId);
          const parentRow = tick.closest('.message-row');
          if (parentRow) {
            parentRow.setAttribute('data-msg-id', messageId);
          }
        }

        console.log('✅ Updated most recent message to FAILED');
        updated = true;
        break;
      }
    }

    if (!updated) {
      console.warn('⚠️ Could not find any sent message to mark as failed');
      const lastMessageRow = document.querySelector('.message-row.sent:last-child');
      if (lastMessageRow) {
        const tick = lastMessageRow.querySelector('.message-tick');
        if (tick && !tick.classList.contains('failed')) {
          tick.innerHTML = '❌';
          tick.className = 'message-tick failed';
          tick.style.color = '#dc3545';
          tick.title = status;
          console.log('✅ Updated last message as fallback');
        }
      }
    }

    // Show notification for failed message
    showNotification(`Message ${status.toLowerCase()}`, 'error');
    return;
  }

  // ============================================
  // FOR SENT, DELIVERED, READ STATUSES
  // ============================================

  // First, try to find the message by message_id in the array
  let messageFound = false;
  let targetIndex = -1;

  for (let i = 0; i < messages.length; i++) {
    if (messages[i].message_id === messageId) {
      messages[i].status = status;
      messageFound = true;
      targetIndex = i;
      console.log(`✅ Updated message at index ${i} to status ${status} (by message_id match)`);
      break;
    }
  }

  // If not found, look for the message by position (most recent without final status)
  if (!messageFound && messageId && messageId !== '') {
    for (let i = messages.length - 1; i >= 0; i--) {
      if (messages[i].message_type === 'Sent' &&
          messages[i].status !== 'Read' &&
          messages[i].status !== 'Delivered' &&
          !messages[i].status.includes('Failed') &&
          !messages[i].status.includes('Re-engagement') &&
          !messages[i].status.includes('Blocked')) {
        // This is likely the message we're updating
        messages[i].message_id = messageId;
        messages[i].status = status;
        messageFound = true;
        targetIndex = i;
        console.log(`✅ Assigned message_id ${messageId} to message at index ${i} and set status to ${status}`);
        break;
      }
    }
  }

  // Find the tick span in DOM
  let tickSpan = null;

  // Method 1: By data attribute
  if (messageId && messageId !== '') {
    tickSpan = document.querySelector(`.message-tick[data-msg-id="${messageId}"]`);
  }

  // Method 2: By parent row data attribute
  if (!tickSpan && messageId && messageId !== '') {
    const messageRow = document.querySelector(`.message-row[data-msg-id="${messageId}"]`);
    if (messageRow) {
      tickSpan = messageRow.querySelector('.message-tick');
      if (tickSpan) {
        console.log('✅ Found tick span by message row data attribute');
      }
    }
  }

  // Method 3: Search by HTML content (only if we have a messageId)
  if (!tickSpan && messageId && messageId !== '') {
    const allRows = document.querySelectorAll('.message-row');
    for (const row of allRows) {
      if (row.innerHTML.includes(messageId)) {
        tickSpan = row.querySelector('.message-tick');
        if (tickSpan) {
          tickSpan.setAttribute('data-msg-id', messageId);
          row.setAttribute('data-msg-id', messageId);
          console.log('✅ Found tick span by searching HTML content');
          break;
        }
      }
    }
  }

  // Method 4: If we have a target index from the array, find that message in DOM
  if (!tickSpan && targetIndex !== -1) {
    const allSentRows = document.querySelectorAll('.message-row.sent');
    // Messages array and DOM should be in same order
    if (targetIndex < allSentRows.length) {
      tickSpan = allSentRows[targetIndex].querySelector('.message-tick');
      if (tickSpan) {
        console.log(`✅ Found tick span by array index ${targetIndex}`);
        if (messageId && messageId !== '') {
          tickSpan.setAttribute('data-msg-id', messageId);
          allSentRows[targetIndex].setAttribute('data-msg-id', messageId);
        }
      }
    }
  }

  // Method 5: Fallback - use the most recent sent message that matches the expected status
  if (!tickSpan) {
    const sentRows = document.querySelectorAll('.message-row.sent');
    if (sentRows.length > 0) {
      // For READ status, find the message that was Delivered or Sent
      if (status === 'Read') {
        for (let i = sentRows.length - 1; i >= 0; i--) {
          const tick = sentRows[i].querySelector('.message-tick');
          if (tick && (tick.classList.contains('delivered') || tick.classList.contains('sent'))) {
            tickSpan = tick;
            console.log('⚠️ Using delivered/sent message for READ update');
            break;
          }
        }
      }
      // For DELIVERED status, find the message that was Sent
      else if (status === 'Delivered') {
        for (let i = sentRows.length - 1; i >= 0; i--) {
          const tick = sentRows[i].querySelector('.message-tick');
          if (tick && tick.classList.contains('sent') && !tick.classList.contains('delivered')) {
            tickSpan = tick;
            console.log('⚠️ Using sent message for DELIVERED update');
            break;
          }
        }
      }

      // Ultimate fallback
      if (!tickSpan) {
        tickSpan = sentRows[sentRows.length - 1].querySelector('.message-tick');
        console.log('⚠️ Using newest sent message as final fallback');
      }
    }
  }

  // Update the tick if found
  if (tickSpan) {
    // Don't update if it's already failed (prevent overwriting)
    if (tickSpan.classList.contains('failed')) {
      console.log('⚠️ Skipping update - message already marked as failed');
      return;
    }

    // Clear existing classes
    tickSpan.className = 'message-tick';

    if (status === 'Read') {
      tickSpan.textContent = '✓✓';
      tickSpan.classList.add('read');
      tickSpan.style.color = '#34B7F1';
      tickSpan.style.fontWeight = 'bold';
      console.log('✅ Updated tick to READ (blue double tick)');
    }
    else if (status === 'Delivered') {
      tickSpan.textContent = '✓✓';
      tickSpan.classList.add('delivered');
      tickSpan.style.color = '#25D366';
      tickSpan.style.fontWeight = 'bold';
      console.log('✅ Updated tick to DELIVERED (green double tick)');
    }
    else if (status === 'Sent') {
      tickSpan.textContent = '✓';
      tickSpan.classList.add('sent');
      tickSpan.style.color = '#8696a0';
      tickSpan.style.fontWeight = 'normal';
      console.log('✅ Updated tick to SENT (single tick)');
    }

    // Store the message ID for future updates
    if (messageId && messageId !== '') {
      tickSpan.setAttribute('data-msg-id', messageId);
      const parentRow = tickSpan.closest('.message-row');
      if (parentRow) {
        parentRow.setAttribute('data-msg-id', messageId);
      }
    }
  } else {
    console.error(`❌ Could not find tick span for message ${messageId}`);
  }
}

    // ============================================
    // SEND MESSAGE
    // ============================================
   async function sendMessage() {
    const text = messageInput.value.trim();
    const file = mediaInput.files[0];

    if (!selectedMobile) {
        showNotification('Select a contact first', 'error');
        return;
    }
    if (!text && !file) {
        showNotification('Enter a message or select a file', 'error');
        return;
    }

    // File size validation
    if (file) {
        const fileSizeMB = file.size / (1024 * 1024);
        const fileType = file.type.split('/')[0];
        let maxSize = 16;
        if (fileType === 'image') maxSize = 5;
        if (fileType === 'video') maxSize = 16;
        if (fileType === 'audio') maxSize = 16;
        if (fileSizeMB > maxSize) {
            showNotification(`File too large! Max ${maxSize}MB. Yours: ${fileSizeMB.toFixed(2)}MB`, 'error');
            mediaInput.value = '';
            cancelFile();
            return;
        }
    }

    const originalBtnHtml = sendBtn.innerHTML;
    sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    sendBtn.disabled = true;

    try {
        if (file) {
            const formData = new FormData();
            formData.append('mobile', selectedMobile);
            formData.append('text', text);
            formData.append('media', file);
            showNotification(`Uploading ${file.name}...`, 'info');

            const response = await fetch('/messaging2/api/send-reply2/', {
                method: 'POST',
                headers: { 'X-CSRFToken': CSRF },
                body: formData
            });
            const result = await response.json();
            if (result.status === 'ok') {
                // The server will broadcast via WebSocket – no manual addition needed
                showNotification('Message sent successfully!', 'success');
                messageInput.value = '';
                mediaInput.value = '';
                cancelFile();
            } else {
                showNotification('Failed to send', 'error');
            }
        } 
        else if (text) {
            // Only send via WebSocket – server will broadcast the message
            sendWS({ 
                type: 'send_message', 
                mobile: selectedMobile, 
                text: text, 
                content_type: 'text' 
            });
            messageInput.value = '';
            showNotification('Message sent!', 'success');
            // No optimistic addition – rely on WebSocket broadcast
        }
    } catch (error) {
        console.error('Send error:', error);
        showNotification(`Error: ${error.message}`, 'error');
    } finally {
        sendBtn.innerHTML = originalBtnHtml;
        sendBtn.disabled = false;
    }
}

    // ============================================
    // MEDIA & UTILITIES
    // ============================================

    let zoomLevel = 1;

    function openMedia(src, type) {
      const modal = document.getElementById('mediaModal');
      const content = document.getElementById('mediaContent');

      if (type === 'image') {
        content.innerHTML = `
          <img id="modalImage" src="${src}"
            style="max-width: 100%; max-height: 90vh; object-fit: contain; transform: scale(1); transition: transform 0.2s; cursor: zoom-in;">
        `;

        zoomLevel = 1;

        const img = document.getElementById('modalImage');

        img.style.pointerEvents = "auto";

        img.onwheel = function(e) {
          e.preventDefault();

          if (e.deltaY < 0) {
            zoomLevel += 0.1;
          } else {
            zoomLevel -= 0.1;
          }

          zoomLevel = Math.max(0.5, Math.min(zoomLevel, 3));
          img.style.transform = `scale(${zoomLevel})`;
        };

        img.ondblclick = function() {
          zoomLevel = zoomLevel === 1 ? 2 : 1;
          img.style.transform = `scale(${zoomLevel})`;
        };

      } else {
        content.innerHTML = `
          <video src="${src}" controls autoplay
            style="max-width: 100%; max-height: 90vh;">
          </video>
        `;
      }

      modal.classList.add('show');
    }

    function closeMediaModal() {
      document.getElementById('mediaModal').classList.remove('show');
      document.getElementById('mediaContent').innerHTML = '';
      zoomLevel = 1;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTime(isoString) {
      const date = new Date(isoString);
      const now = new Date();
      const diff = now - date;
      if (diff < 86400000) {
        return date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      } else if (diff < 604800000) {
        return date.toLocaleDateString('en-IN', { weekday: 'short' });
      } else {
        return date.toLocaleDateString('en-IN', { day: '2-digit', month: '2-digit' });
      }
    }

    // ============================================
    // HANDLE WEBSOCKET MESSAGES
    // ============================================
    function handleWebSocketMessage(data) {
      console.log('📨 WebSocket message received:', data.type);

      switch (data.type) {
        case 'contacts.page':
          renderContacts(data.contacts, data.page === 1, data.unread_count, data.has_more, data.page);
          break;

        case 'messages.page':
          console.log('📥 ========== MESSAGES.PAGE RECEIVED ==========');
          console.log('📥 Mobile from server:', data.mobile);
          console.log('📥 Current selected:', selectedMobile);
          console.log('📥 Messages count:', data.messages ? data.messages.length : 0);
          console.log('📥 Debug count:', data.debug_count);
          console.log('📥 Has more:', data.has_more);
          console.log('📥 Full data:', data);

          if (data.messages && data.messages.length > 0) {
            console.log('📥 First message:', data.messages[0]);
          }

          if (data.mobile === selectedMobile) {
            console.log('✅ Mobile matches, rendering messages...');
            if (data.messages && data.messages.length > 0) {
              renderMessages(data.messages, data.has_more, data.next_cursor_date, data.is_initial === true || messages.length === 0);
            } else {
              console.log('⚠️ No messages in response');
              messagesContainer.innerHTML = '<div class="empty-state">No messages found (but DB has data - check console)</div>';
            }
          } else {
            console.log('❌ Mobile mismatch! Server:', data.mobile, 'Selected:', selectedMobile);
          }
          break;

        case 'new.message':
          if (data.message.mobile === selectedMobile) {
            appendMessage(data.message);
          }
          updateContactInList(data.message);
          break;

        case 'delivery.update':
          console.log('📬 Delivery update received:', data.message_id, data.status);
          updateMessageTickImproved(data.message_id, data.status);
          if (data.mobile) updateContactStatus(data.mobile, data.status);
          break;

        case 'unread.update':
          if (data.unread_count !== undefined) {
            totalUnreadCount = data.unread_count;
            const badge = document.getElementById('unreadCountBadge');
            if (badge) {
              if (totalUnreadCount > 0) {
                badge.style.display = 'inline';
                badge.textContent = totalUnreadCount;
              } else {
                badge.style.display = 'none';
              }
            }
            if (currentFilter === 'unread') loadContacts(1);
          }
          break;

        case 'contact.update':
          if (data.contact) {
            const existingContact = contacts.find(c => c.mobile === data.contact.mobile);
            if (existingContact && !data.contact.last_time) {
              data.contact.last_time = existingContact.last_time;
            }
            updateContactInList(data.contact);
          }
          break;

        case 'typing':
          if (data.mobile === selectedMobile) {
            typingIndicator.style.display = data.state ? 'block' : 'none';
          }
          break;

        case 'joined':
          console.log('Joined chat:', data.mobile);
          break;

        case 'marked_read':
          console.log('Marked read:', data.mobile);
          break;

        case 'error':
          console.error('WebSocket error:', data.message);
          showNotification(data.message, 'error');
          break;
      }
    }
