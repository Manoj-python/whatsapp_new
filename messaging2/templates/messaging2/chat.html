<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PSF Cases - WhatsApp Chat Dashboard</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --whatsapp-green: #25D366;
      --whatsapp-dark: #075E54;
      --whatsapp-teal: #128C7E;
      --chat-bg: #E5DDD5;
      --sent-bubble: #DCF8C6;
      --received-bubble: #FFFFFF;
      --sidebar-bg: #F0F2F5;
      --esc1: #4caf50;
      --esc2: #2196f3;
      --esc3: #ff9800;
      --esc4: #9c27b0;
      --esc5: #f44336;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--chat-bg);
      height: 100vh;
      overflow: hidden;
    }
    .chat-container { display: flex; height: 100vh; background: var(--sidebar-bg); overflow: hidden; }
    .sidebar {
      width: 380px; background: white; border-right: 1px solid #e9ecef;
      display: flex; flex-direction: column; height: 100vh; transition: transform 0.3s ease; overflow: hidden;
    }
    @media (max-width: 768px) {
      .sidebar { width: 100%; position: fixed; left: 0; top: 0; z-index: 1000; transform: translateX(0); }
      .sidebar.hide { transform: translateX(-100%); }
      .chat-area { width: 100%; }
    }
    .sidebar-header { padding: 16px; background: var(--whatsapp-dark); color: white; flex-shrink: 0; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .header-top h4 { margin: 0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .user-badge { width: 32px; height: 32px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: white; }
    .esc-number { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: white; background: var(--esc1); }
    .role-name { font-size: 12px; font-weight: 500; color: white; }
    .search-box { padding: 12px; background: white; border-bottom: 1px solid #e9ecef; flex-shrink: 0; }
    .search-box input { width: 100%; padding: 10px 16px; border: none; background: var(--sidebar-bg); border-radius: 20px; font-size: 14px; outline: none; }
    .chat-tabs { display: flex; background: white; border-bottom: 1px solid #e9ecef; padding: 0 16px; gap: 24px; }
    .chat-tab { padding: 12px 0; font-size: 15px; font-weight: 500; color: #667781; cursor: pointer; position: relative; }
    .chat-tab.active { color: var(--whatsapp-green); }
    .chat-tab.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--whatsapp-green); border-radius: 3px; }
    .chat-tab .badge { background: #dc3545; color: white; font-size: 11px; padding: 2px 6px; border-radius: 12px; margin-left: 6px; }
    .contact-list { flex: 1; overflow-y: auto; overflow-x: hidden; }
    .contact-item { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f0f0f0; min-height: 72px; background: white; }
    .contact-item.active { background: #e8f0fe; }
    .contact-avatar { width: 48px; height: 48px; min-width: 48px; border-radius: 50%; background: var(--whatsapp-green); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; margin-right: 12px; position: relative; }
    .esc-level-indicator { position: absolute; bottom: -2px; right: -2px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid white; font-size: 9px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
    .level-ESC1 { background: var(--esc1); }
    .level-ESC2 { background: var(--esc2); }
    .level-ESC3 { background: var(--esc3); }
    .level-ESC4 { background: var(--esc4); }
    .level-ESC5 { background: var(--esc5); }
    .level-RESOLVED { background: #28a745; font-size: 11px; }
    .level-CLOSED { background: #c50d1d; font-size: 11px; }
    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; color: #111; display: flex; justify-content: space-between; align-items: center; }
    .contact-last-msg { font-size: 13px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact-meta { text-align: right; flex-shrink: 0; min-width: 45px; }
    .contact-time { font-size: 11px; color: #667781; margin-bottom: 4px; }
    .unread-badge { background: var(--whatsapp-green); color: white; border-radius: 20px; padding: 2px 8px; font-size: 11px; font-weight: 600; display: inline-block; min-width: 20px; text-align: center; }
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); height: 100vh; overflow: hidden; }
    .chat-header { background: white; padding: 12px 20px; display: flex; align-items: center; border-bottom: 1px solid #e9ecef; flex-shrink: 0; }
    .chat-header-back { display: none; background: none; border: none; font-size: 20px; margin-right: 12px; cursor: pointer; padding: 8px; border-radius: 50%; }
    @media (max-width: 768px) { .chat-header-back { display: block; } }
    .chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--whatsapp-green); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; margin-right: 12px; flex-shrink: 0; }
    .chat-header-info { flex: 1; }
    .chat-header-name { font-weight: 600; font-size: 16px; margin-bottom: 2px; }
    .chat-header-status { font-size: 12px; color: #667781; }
    .case-panel-btn { background: linear-gradient(135deg, #4361ee, #3f37c9); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; margin-left: 10px; cursor: pointer; transition: all 0.2s; }
    .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .message-row { display: flex; width: 100%; margin-bottom: 4px; }
    .message-row.sent { justify-content: flex-end; }
    .message-row.received { justify-content: flex-start; }
    .message-bubble { max-width: 70%; min-width: 60px; padding: 8px 12px; border-radius: 12px; word-wrap: break-word; }
    .message-bubble.sent { background: var(--sent-bubble); border-bottom-right-radius: 4px; }
    .message-bubble.received { background: var(--received-bubble); border-bottom-left-radius: 4px; }
    .message-text { font-size: 14px; line-height: 1.4; color: #111; }
    .message-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px; font-size: 10px; color: #667781; }
    .message-time { font-size: 10px; }
    .message-tick { font-size: 12px; margin-left: 4px; display: inline-block; }
    .message-tick.sent { color: #8696a0; }
    .message-tick.delivered { color: #25D366; font-weight: bold; }
    .message-tick.read { color: #34B7F1; font-weight: bold; }
    .message-tick.failed { color: #dc3545; }
    .message-image { max-width: 250px; max-height: 250px; border-radius: 8px; cursor: pointer; }
    .message-video { max-width: 250px; border-radius: 8px; cursor: pointer; }
    .composer { background: white; padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #e9ecef; }
    .composer-input { flex: 1; display: flex; align-items: center; background: var(--sidebar-bg); border-radius: 24px; padding: 8px 16px; }
    .composer-input input { flex: 1; border: none; background: none; outline: none; font-size: 14px; }
    .composer button { background: var(--whatsapp-green); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
    .case-sidebar { width: 350px; background: white; border-left: 1px solid #e9ecef; display: flex; flex-direction: column; height: 100vh; transform: translateX(100%); transition: transform 0.3s ease; position: fixed; right: 0; top: 0; z-index: 1001; }
    .case-sidebar.show { transform: translateX(0); }
    .case-sidebar-header { padding: 16px; background: var(--whatsapp-dark); color: white; display: flex; justify-content: space-between; align-items: center; }
    .case-sidebar-header h5 { margin: 0; }
    .close-case-sidebar { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
    .case-sidebar-content { flex: 1; overflow-y: auto; padding: 16px; }
    .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #f3f3f3; border-top: 2px solid var(--whatsapp-green); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading, .empty-state { text-align: center; padding: 40px; color: #667781; }
    .notification { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: white; z-index: 9999; animation: slideInRight 0.3s ease; }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .notification.success { background: var(--whatsapp-green); }
    .notification.error { background: #dc3545; }
    .notification.info { background: #17a2b8; }
    .notification.warning { background: #ff9800; }
    .date-separator { text-align: center; margin: 16px 0; }
    .date-separator span { background: rgba(0,0,0,0.05); padding: 4px 12px; border-radius: 12px; font-size: 11px; color: #667781; }
    .load-older-container { display: flex; justify-content: center; margin: 16px 0; cursor: pointer; }
    .load-older-btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; background: var(--whatsapp-green); color: white; border-radius: 24px; font-size: 13px; font-weight: 500; }
    .file-preview { background: white; padding: 8px 20px; border-top: 1px solid #e9ecef; display: none; }
    .file-preview.show { display: block; }
    .preview-card { background: #f8f9fa; padding: 8px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .typing-indicator { padding: 8px 20px; font-size: 12px; color: #667781; font-style: italic; }
    .media-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 2000; }
    .media-modal.show { display: flex; align-items: center; justify-content: center; }
    .modal-close { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.7); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 24px; cursor: pointer; z-index: 2001; }
    .message-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 6px; font-size: 10px; flex-wrap: wrap; }
    .message-sender { font-weight: 600; color: #075E54; font-size: 10px; }
    .message-row.received .message-sender { color: #128C7E; }
    .contact-dept {
    font-size: 11px;
    color: #6c757d;
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 4px;
}
.contact-dept i {
    font-size: 10px;
}
    @media (max-width: 768px) { .message-bubble { max-width: 85%; min-width: 50px; padding: 6px 10px; } .composer { padding: 8px 12px; } }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="header-top">
        <h4 onclick="goToDashboard()"><i class="fab fa-whatsapp"></i> PSF Chats</h4>
        <span class="esc-number">{{ agent.level|default:"ESC1" }}</span>
        <span class="role-name">{{ agent.role|default:"Agent" }}</span>
        <div class="user-badge">{{ request.user.username|slice:":2"|upper }}</div>
      </div>
    </div>
    <div class="chat-tabs">
      <div class="chat-tab active" data-filter="all" onclick="switchTab('all')">All</div>
      <div class="chat-tab" data-filter="unread" onclick="switchTab('unread')">
        Unread <span class="badge" id="unreadCountBadge" style="display: none;">0</span>
      </div>
    </div>
    <div class="search-box"><input type="text" id="searchInput" placeholder="Search contacts..."></div>
    <div class="contact-list" id="contactList"><div class="loading">Loading contacts...</div></div>
  </div>

  <div class="chat-area" id="chatArea" style="display: none;">
    <div class="chat-header">
      <button class="chat-header-back" id="backBtn"><i class="fas fa-arrow-left"></i></button>
      <div class="chat-header-avatar" id="headerAvatar">👤</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="headerName">Select a chat</div>
        <div class="chat-header-status" id="headerStatus"></div>
      </div>
      <button class="case-panel-btn" id="casePanelBtn" title="View Case Details"><i class="fas fa-folder-open"></i></button>
    </div>
    <div class="messages-container" id="messagesContainer"><div class="empty-state">Select a contact to start chatting</div></div>
    <div class="typing-indicator" id="typingIndicator" style="display: none;">Typing...</div>
    <div class="composer" style="display: none;">
      <div class="composer-input">
        <button id="attachBtn"><i class="fas fa-paperclip"></i></button>
        <input type="text" id="messageInput" placeholder="Type a message...">
      </div>
      <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
      <input type="file" id="mediaInput" style="display: none;" accept="image/*,video/*,audio/*,.pdf,.doc,.docx">
    </div>
    <div class="file-preview" id="filePreview">
      <div class="preview-card"><i class="fas fa-file"></i><div class="preview-info">No file selected</div><button class="preview-cancel" onclick="cancelFile()">✖</button></div>
    </div>
  </div>
</div>
<div class="case-sidebar" id="caseSidebar">
  <div class="case-sidebar-header"><h5><i class="fas fa-folder-open"></i> Case Details</h5><button class="close-case-sidebar" onclick="closeCaseSidebar()">×</button></div>
  <div class="case-sidebar-content" id="caseSidebarContent"><div class="text-center py-4"><div class="loading-spinner"></div><p>Loading case details...</p></div></div>
</div>
<div id="mediaModal" class="media-modal"><button class="modal-close" onclick="closeMediaModal()">×</button><div id="mediaContent"></div></div>

<script>
  // ========== CONFIG ==========
  const CSRF = document.querySelector('meta[name="csrf-token"]').content;
  let ws = null, selectedMobile = null, contacts = [], messages = [], isLoadingMessages = false, hasMoreMessages = true;
  let reconnectAttempts = 0, typingTimeout = null, currentFilter = 'all', totalUnreadCount = 0;
  let contactPage = 1, isLoadingContacts = false, hasMoreContacts = true, lastProcessedPage = 0, isRenderingContacts = false, scrollTimeout = null;
  let currentCaseData = null;
  let currentUser = {
    name: "{{ request.user.username|default:'Agent' }}",
    role: "{{ agent.role|default:'AGENT' }}",
    level: "{{ agent.level|default:'ESC1' }}"
  };
  let availableGroups = [];

  function updateUIBadge() {
    const userBadge = document.querySelector('.user-badge');
    if (userBadge) {
      const roleColors = { 'AGENT': '#4caf50', 'EXCUTIVE': '#ff9800', 'MANAGER': '#9c27b0', 'ADMIN': '#f44336' };
      userBadge.style.background = roleColors[currentUser.role] || 'rgba(255,255,255,0.2)';
    }
  }
  updateUIBadge();
  console.log('Current User:', currentUser);

  const contactListEl = document.getElementById('contactList'), chatArea = document.getElementById('chatArea');
  const messagesContainer = document.getElementById('messagesContainer'), headerName = document.getElementById('headerName');
  const headerAvatar = document.getElementById('headerAvatar'), headerStatus = document.getElementById('headerStatus');
  const composer = document.querySelector('.composer'), messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn'), attachBtn = document.getElementById('attachBtn'), mediaInput = document.getElementById('mediaInput');
  const searchInput = document.getElementById('searchInput'), typingIndicator = document.getElementById('typingIndicator');
  const backBtn = document.getElementById('backBtn'), filePreview = document.getElementById('filePreview');

  function goToDashboard() {
    const role = "{{ agent.role|default:'AGENT' }}";
    let url = "";
    switch(role) {
      case 'AGENT': url = "{% url 'agent_dashboard' %}"; break;
      case 'EXECUTIVE':  url = "{% url 'executive_dashboard' %}"; break;
      case 'HEAD':  url = "{% url 'head_dashboard' %}"; break;
      case 'MANAGER': url = "{% url 'manager_dashboard' %}"; break;
      default: url = "{% url 'admin_dashboard' %}";
    }
    window.location.href = url;
  }

  function openCaseSidebar() { if (!selectedMobile) { showNotification('Select a contact first', 'warning'); return; } document.getElementById('caseSidebar').classList.add('show'); renderCasePanel(); }
  function closeCaseSidebar() { document.getElementById('caseSidebar').classList.remove('show'); }

  async function fetchGroups() {
    try {
      const resp = await fetch('/messaging2/api/groups/');
      const data = await resp.json();
      availableGroups = data.groups || [];
    } catch(e) { console.error('Failed to load groups', e); availableGroups = []; }
  }

  async function renderCasePanel() {
    const content = document.getElementById('caseSidebarContent');
    if (!content) return;
    content.innerHTML = '<div class="text-center py-4"><div class="loading-spinner"></div><p>Loading case details...</p></div>';
    try {
      const response = await fetch(`/messaging2/case/by-mobile/?mobile=${encodeURIComponent(selectedMobile)}`);
      const data = await response.json();
      if (data.case) {
        currentCaseData = data.case;
        const levelColors = { 'ESC0':'secondary','ESC1':'success','ESC2':'info','ESC3':'warning','ESC4':'danger','ESC5':'dark','RESOLVED':'success','CLOSED':'secondary' };
        let levelIcon = '';
        if (currentCaseData.current_level === 'RESOLVED') levelIcon = '✅';
        else if (currentCaseData.current_level === 'CLOSED') levelIcon = '🔒';
        else if (currentCaseData.current_level === 'ESC1') levelIcon = '📞';
        else if (currentCaseData.current_level === 'ESC2') levelIcon = '⚖️';
        else if (currentCaseData.current_level === 'ESC3') levelIcon = '⭐';
        else if (currentCaseData.current_level === 'ESC4') levelIcon = '📊';
        else levelIcon = '🔒';

        let groupName = currentCaseData.group_name || 'Not assigned';

        // Determine available escalation levels (higher than current)
        const allLevels = ['ESC1', 'ESC2', 'ESC3', 'ESC4', 'ESC5'];
        const currentIdx = allLevels.indexOf(currentCaseData.current_level);
        let availableLevels = allLevels.slice(currentIdx + 1);
        let escalateOptions = '';
        let showEscalate = (currentCaseData.status !== 'Resolved' && currentCaseData.status !== 'Closed' && availableLevels.length > 0);
        if (showEscalate) {
          const levelNames = {
            'ESC1': '📞 Normal (ESC1)',
            'ESC2': '⚖️ Executive (ESC2)',
            'ESC3': '⭐ Manager (ESC3)',
            'ESC4': '📊 Head (ESC4)',
            'ESC5': '🔒 Admin (ESC5)'
          };
          for (let lvl of availableLevels) {
            escalateOptions += `<option value="${lvl}">${levelNames[lvl]}</option>`;
          }
        }
        let showResolve = (currentCaseData.status !== 'Resolved' && currentCaseData.status !== 'Closed');

        let html = `
          <div class="case-info-section">
            <h6 class="border-bottom pb-2 mb-3"><i class="fas fa-info-circle"></i> Case Information</h6>
            <div class="mb-2"><label>Case ID:</label> <strong>${escapeHtml(currentCaseData.case_id)}</strong></div>
            <div class="mb-2"><label>Customer:</label> ${escapeHtml(currentCaseData.customer_name || selectedMobile)}</div>
            <div class="mb-2"><label>Loan Number:</label> <span class="badge bg-secondary">${escapeHtml(currentCaseData.loan_number || 'Not provided')}</span></div>
            <div class="mb-2"><label>Department:</label> ${escapeHtml(groupName)}</div>
            <div class="mb-2"><label>Current Level:</label> <span class="badge bg-${levelColors[currentCaseData.current_level] || 'secondary'}">${levelIcon} ${currentCaseData.current_level}</span></div>
            <div class="mb-2"><label>Status:</label> <span class="badge bg-${currentCaseData.status === 'Resolved' ? 'success' : 'primary'}">${currentCaseData.status || 'Open'}</span></div>
            <div class="mb-2"><label>Assigned To:</label> ${escapeHtml(currentCaseData.assigned_to_name || 'Unassigned')}</div>
            <div class="mb-2"><label>Issue:</label> <div class="border rounded p-2 bg-light small">${escapeHtml(currentCaseData.issue_description || 'No description')}</div></div>
          </div>
          <hr>
          <div class="case-actions-section">
            <h6 class="border-bottom pb-2 mb-3"><i class="fas fa-cogs"></i> Actions</h6>
        `;

        

        if (showResolve) {
          html += `
            <div class="mb-3">
              <textarea id="resolutionNotesText" class="form-control form-control-sm mb-2" rows="2" placeholder="Resolution notes..."></textarea>
              <button class="btn btn-success btn-sm w-100" onclick="resolveCurrentCase()">✅ Resolve Case</button>
            </div>
          `;
        }

        html += `
            <button class="btn btn-outline-primary btn-sm w-100 mb-2" onclick="viewCaseTimeline()"><i class="fas fa-history"></i> View Timeline</button>
            <button class="btn btn-outline-secondary btn-sm w-100" onclick="openCreateAnotherCaseForm()"><i class="fas fa-plus"></i> Create Another Case</button>
          </div>
        `;

        content.innerHTML = html;
      } else {
        // No case: show creation form
        if (availableGroups.length === 0) await fetchGroups();
        let groupsHtml = '<select id="newCaseGroup" class="form-select form-select-sm mb-2" required><option value="">Select Department</option>';
        availableGroups.forEach(g => { groupsHtml += `<option value="${escapeHtml(g.name)}">${escapeHtml(g.name)}</option>`; });
        groupsHtml += '</select>';

        let escalationOptions = '<option value="">-- No escalation (ESC1) --</option>';
        const creationLevels = ['ESC2', 'ESC3', 'ESC4', 'ESC5'];
        const levelNamesShort = { 'ESC2': 'Executive (ESC2)', 'ESC3': 'Manager (ESC3)', 'ESC4': 'Head (ESC4)', 'ESC5': 'Admin (ESC5)' };
        for (let lvl of creationLevels) {
          escalationOptions += `<option value="${lvl}">${levelNamesShort[lvl]}</option>`;
        }

        content.innerHTML = `
          <div class="text-center py-3">
            <i class="fas fa-folder-open fa-3x text-muted mb-3"></i>
            <p>No active case found. Create a new case:</p>
            <div class="text-start">
              <div class="mb-2">
                <label class="form-label small fw-bold">Customer Name</label>
                <input type="text" id="newCaseCustomerName" class="form-control form-control-sm" value="${escapeHtml(headerName.textContent)}">
              </div>
              <div class="mb-2">
                <label class="form-label small fw-bold">Loan Number</label>
                <input type="text" id="newCaseLoanNumber" class="form-control form-control-sm" placeholder="e.g., LOAN12345">
              </div>
              <div class="mb-2">
                <label class="form-label small fw-bold">Department (Group)</label>
                ${groupsHtml}
              </div>
              <div class="mb-2">

  // Escalate case
  window.escalateCase = async function() {
    const level = document.getElementById('escalateLevelSelect')?.value;
    const reason = document.getElementById('escalateReasonText')?.value;
    const loan = document.getElementById('escalateLoanNumber')?.value;
    const name = document.getElementById('escalateCustomerName')?.value;
    if (!level) { showNotification('Please select escalation level', 'warning'); return; }
    if (!reason) { showNotification('Please provide a reason for escalation', 'warning'); return; }
    try {
      const response = await fetch(`/messaging2/case/${currentCaseData.case_id}/escalate/`, {
        method: 'POST', headers: { 'Content-Type':'application/json', 'X-CSRFToken':CSRF },
        body: JSON.stringify({ new_level:level, reason, loan, name, escalated_by:currentUser.name })

      const data = await response.json();
      if (data.success) {
        showNotification(`Escalated to ${level}`, 'success');
        closeCaseSidebar();
        await loadCaseForMobile(selectedMobile);
        await renderCasePanel();
      } else {
        showNotification(data.error || 'Escalation failed', 'error');
      }
    } catch(e) { showNotification('Error: ' + e.message, 'error'); }
  };

  window.resolveCurrentCase = async function() {
    const notes = document.getElementById('resolutionNotesText')?.value;
    if (!notes) { showNotification('Please provide resolution notes', 'warning'); return; }
    try {
      const response = await fetch(`/messaging2/case/${currentCaseData.case_id}/resolve/`, {
        method: 'POST', headers: { 'Content-Type':'application/json', 'X-CSRFToken':CSRF },
        body: JSON.stringify({ resolution_notes:notes, resolved_by:currentUser.name })

      if (data.success) { showNotification('Case resolved', 'success'); closeCaseSidebar(); await loadCaseForMobile(selectedMobile); await renderCasePanel(); }

    } catch(e) { showNotification('Error: ' + e.message, 'error'); }

  window.viewCaseTimeline = async function() {
    if (!currentCaseData) { showNotification('No case data', 'error'); return; }

  window.createCaseFromChat = async function(forceNew = false) {
    const description = document.getElementById('newCaseDesc')?.value;
    const groupSelect = document.getElementById('newCaseGroup');
    const customerNameInput = document.getElementById('newCaseCustomerName');
    const loanNumberInput = document.getElementById('newCaseLoanNumber');
    const escalateSelect = document.getElementById('newCaseEscalateTo');

    if (!groupSelect) { showNotification('Group selector missing', 'error'); return; }
    const groupName = groupSelect.value;
    const customerName = customerNameInput ? customerNameInput.value.trim() : headerName.textContent;
    const loanNumber = loanNumberInput ? loanNumberInput.value.trim() : '';
    const escalateTo = escalateSelect ? escalateSelect.value : '';

    if (!description) { showNotification('Please describe the issue', 'warning'); return; }
    if (!groupName) { showNotification('Please select a department (group)', 'warning'); return; }

    try {
      const response = await fetch('/messaging2/case/create-from-chat/', {
        method: 'POST', headers: { 'Content-Type':'application/json', 'X-CSRFToken':CSRF },
        body: JSON.stringify({
          mobile: selectedMobile,
          customer_name: customerName,
          agent_name: currentUser.name,
          issue_description: description,
          loan_number: loanNumber,
          group: groupName,
          escalate_to: escalateTo || null,
          force_new: forceNew
        })
      });
      const data = await response.json();
      if (data.success) {
        if (data.existing && !forceNew) {
          const userConfirmed = confirm(data.message + '\nClick OK to create a new case anyway, Cancel to view existing case.');
          if (userConfirmed) {
            await createCaseFromChat(true);
          } else {
            showNotification(`Existing case: ${data.case.case_id} at level ${data.case.current_level}`, 'info');
            closeCaseSidebar();
            await loadCaseForMobile(selectedMobile);
            renderCasePanel();
          }
          return;
        }
        showNotification(`Case ${data.case.case_id} created at level ${data.case.current_level}!`, 'success');
        closeCaseSidebar();
        await loadCaseForMobile(selectedMobile);
        renderCasePanel();
      } else {
        showNotification(data.error || 'Failed to create case', 'error');
      }
    } catch(e) { showNotification('Error: ' + e.message, 'error'); }
  };

="document-download"><i class="fas fa-download" style="color:${iconColor};"></i></div></div></div>${msg.sent_text_message?`<div class="doc-text">${escapeHtml(msg.sent_text_message)}</div>`:''}`; } else contentHtml=`<div class="message-text">${escapeHtml(msg.sent_text_message||'')}</div>`; let tickHtml=''; let messageId=msg.message_id||msg.id; if(isSent){ if(msg.status==='Read') tickHtml=`<span class="message-tick read" data-msg-id="${messageId}">✓✓</span>`; else if(msg.status==='Delivered') tickHtml=`<span class="message-tick delivered" data-msg-id="${messageId}">✓✓</span>`; else if(msg.status==='Failed'||msg.status==='Blocked'||msg.status==='Invalid'||msg.status==='Re-engagement Required') tickHtml=`<span class="message-tick failed" data-msg-id="${messageId}" title="${msg.status}">❌</span>`; else tickHtml=`<span class="message-tick sent" data-msg-id="${messageId}">✓</span>`; } return `<div class="message-row ${isSent?'sent':'received'}" data-msg-id="${messageId}"><div class="message-bubble ${isSent?'sent':'received'}">${contentHtml}<div class="message-footer"><span class="message-sender">${escapeHtml(senderName)}</span><span class="message-time">${timeDisplay}</span>${tickHtml}</div></div></div>`; }
  function appendMessage(msg){ let wasAtBottom=messagesContainer.scrollHeight-messagesContainer.scrollTop-messagesContainer.clientHeight<100; let needSeparator=false,newLabel=null; if(messages.length>0){ let lastDate=new Date(messages[messages.length-1].sent_at),newDate=new Date(msg.sent_at); if(!isSameDay(lastDate,newDate)){ needSeparator=true; newLabel=formatMessageDate(newDate); } } else{ needSeparator=true; newLabel=formatMessageDate(new Date(msg.sent_at)); } messages.push(msg); let newHtml=''; if(needSeparator) newHtml=`<div class="date-separator"><span>${newLabel}</span></div>`; newHtml+=renderMessage(msg); messagesContainer.insertAdjacentHTML('beforeend',newHtml); if(wasAtBottom) scrollToBottom(); }
  function updateMessageTickImproved(messageId,status){ if(!messageId||messageId===''){ console.warn('Ignoring empty message_id'); return; } console.log(`Update tick ${messageId} -> ${status}`); if(['Failed','Blocked','Invalid','Re-engagement Required','Rate Limited','Auth Failed'].some(s=>status.includes(s))){ let sentMsgs=document.querySelectorAll('.message-row.sent'); let updated=false; for(let i=sentMsgs.length-1;i>=0;i--){ let tick=sentMsgs[i].querySelector('.message-tick'); if(tick&&!tick.classList.contains('delivered')&&!tick.classList.contains('read')&&!tick.classList.contains('failed')){ tick.innerHTML='❌'; tick.className='message-tick failed'; tick.style.color='#dc3545'; tick.title=status; if(messageId) tick.setAttribute('data-msg-id',messageId); updated=true; break; } } if(!updated){ let lastRow=document.querySelector('.message-row.sent:last-child'); if(lastRow){ let tick=lastRow.querySelector('.message-tick'); if(tick){ tick.innerHTML='❌'; tick.className='message-tick failed'; tick.title=status; } } } showNotification(`Message ${status.toLowerCase()}`,'error'); return; } let tickSpan=null; if(messageId) tickSpan=document.querySelector(`.message-tick[data-msg-id="${messageId}"]`); if(!tickSpan&&messageId){ let row=document.querySelector(`.message-row[data-msg-id="${messageId}"]`); if(row) tickSpan=row.querySelector('.message-tick'); } if(!tickSpan){ let rows=document.querySelectorAll('.message-row.sent'); if(rows.length) tickSpan=rows[rows.length-1].querySelector('.message-tick'); } if(tickSpan&&!tickSpan.classList.contains('failed')){ tickSpan.className='message-tick'; if(status==='Read'){ tickSpan.textContent='✓✓'; tickSpan.classList.add('read'); tickSpan.style.color='#34B7F1'; } else if(status==='Delivered'){ tickSpan.textContent='✓✓'; tickSpan.classList.add('delivered'); tickSpan.style.color='#25D366'; } else if(status==='Sent'){ tickSpan.textContent='✓'; tickSpan.classList.add('sent'); tickSpan.style.color='#8696a0'; } if(messageId) tickSpan.setAttribute('data-msg-id',messageId); } }
  function addLoadOlderButton(){ removeLoadOlderButton(); let btn=document.createElement('div'); btn.id='loadOlderButton'; btn.className='load-older-container'; btn.innerHTML='<div class="load-older-btn"><i class="fas fa-chevron-up"></i><span>Load Older Messages</span></div>'; btn.onclick=loadOlderMessages; if(messagesContainer.firstChild) messagesContainer.insertBefore(btn,messagesContainer.firstChild); else messagesContainer.appendChild(btn); }
  function removeLoadOlderButton(){ let existing=document.getElementById('loadOlderButton'); if(existing) existing.remove(); }
  function loadOlderMessages(){ if(isLoadingMessages||!hasMoreMessages) return; isLoadingMessages=true; if(messages.length>0){ let beforeDate=messages[0].sent_at; let loadBtn=document.getElementById('loadOlderButton'); if(loadBtn) loadBtn.innerHTML='<div class="load-older-btn loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>'; sendWS({type:'get_messages',mobile:selectedMobile,before_date:beforeDate,limit:30}); } else isLoadingMessages=false; }
  function scrollToBottom(){ setTimeout(()=>messagesContainer.scrollTop=messagesContainer.scrollHeight,100); }
  async function sendMessage(){ let text=messageInput.value.trim(); let file=mediaInput.files[0]; if(!selectedMobile){ showNotification('Select a contact first','error'); return; } if(!text&&!file){ showNotification('Enter message or select file','error'); return; } if(file){ let sizeMB=file.size/(1024*1024); let type=file.type.split('/')[0]; let max=16; if(type==='image') max=5; if(sizeMB>max){ showNotification(`File too large (max ${max}MB)`,'error'); mediaInput.value=''; cancelFile(); return; } } let originalHtml=sendBtn.innerHTML; sendBtn.innerHTML='<i class="fas fa-spinner fa-spin"></i>'; sendBtn.disabled=true; try{ if(file){ let fd=new FormData(); fd.append('mobile',selectedMobile); fd.append('text',text); fd.append('media',file); let resp=await fetch('/messaging2/api/send-reply2/',{method:'POST',headers:{'X-CSRFToken':CSRF},body:fd}); let result=await resp.json(); if(result.status==='ok'){ showNotification('Sent!','success'); messageInput.value=''; mediaInput.value=''; cancelFile(); } else showNotification('Failed to send','error'); } else if(text){ sendWS({type:'send_message',mobile:selectedMobile,text:text,content_type:'text'}); messageInput.value=''; showNotification('Sent!','success'); } } catch(e){ showNotification('Error: '+e.message,'error'); } finally{ sendBtn.innerHTML=originalHtml; sendBtn.disabled=false; } }
  function onTyping(){ if(!selectedMobile) return; sendWS({type:'typing',mobile:selectedMobile,state:true}); clearTimeout(typingTimeout); typingTimeout=setTimeout(()=>{ sendWS({type:'typing',mobile:selectedMobile,state:false}); },1000); }
  function cancelFile(){ mediaInput.value=''; filePreview.classList.remove('show'); document.querySelector('.preview-info').textContent='No file selected'; }
  let zoomLevel=1; function openMedia(src,type){ let modal=document.getElementById('mediaModal'); let content=document.getElementById('mediaContent'); if(type==='image'){ content.innerHTML=`<img id="modalImage" src="${src}" style="max-width:100%;max-height:90vh;object-fit:contain;transform:scale(1);cursor:zoom-in;">`; zoomLevel=1; let img=document.getElementById('modalImage'); img.onwheel=function(e){ e.preventDefault(); zoomLevel+=e.deltaY<0?0.1:-0.1; zoomLevel=Math.max(0.5,Math.min(zoomLevel,3)); img.style.transform=`scale(${zoomLevel})`; }; img.ondblclick=function(){ zoomLevel=zoomLevel===1?2:1; img.style.transform=`scale(${zoomLevel})`; }; } else content.innerHTML=`<video src="${src}" controls autoplay style="max-width:100%;max-height:90vh;"></video>`; modal.classList.add('show'); }
  function closeMediaModal(){ document.getElementById('mediaModal').classList.remove('show'); document.getElementById('mediaContent').innerHTML=''; zoomLevel=1; }
  function escapeHtml(text){ if(!text) return ''; let div=document.createElement('div'); div.textContent=text; return div.innerHTML; }
  function formatTime(iso){ let d=new Date(iso),now=new Date(),diff=now-d; if(diff<86400000) return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); if(diff<604800000) return d.toLocaleDateString('en-IN',{weekday:'short'}); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit'}); }
  function handleWebSocketMessage(data){ console.log('WS msg:',data.type); switch(data.type){ case 'contacts.page': renderContacts(data.contacts,data.page===1,data.unread_count,data.has_more,data.page); break; case 'messages.page': if(data.mobile===selectedMobile){ if(data.messages&&data.messages.length) renderMessages(data.messages,data.has_more,data.next_cursor_date,data.is_initial||messages.length===0); else messagesContainer.innerHTML='<div class="empty-state">No messages</div>'; } break; case 'new.message': if(data.message.mobile===selectedMobile) appendMessage(data.message); updateContactInList(data.message); break; case 'delivery.update': updateMessageTickImproved(data.message_id,data.status); if(data.mobile) updateContactStatus(data.mobile,data.status); break; case 'unread.update': totalUnreadCount=data.unread_count; let badge=document.getElementById('unreadCountBadge'); if(badge){ if(totalUnreadCount>0){ badge.style.display='inline'; badge.textContent=totalUnreadCount; } else badge.style.display='none'; } if(currentFilter==='unread') loadContacts(1); break; case 'contact.update': if(data.contact){ let existing=contacts.find(c=>c.mobile===data.contact.mobile); if(existing&&!data.contact.last_time) data.contact.last_time=existing.last_time; updateContactInList(data.contact); } break; case 'typing': if(data.mobile===selectedMobile) typingIndicator.style.display=data.state?'block':'none'; break; case 'error': showNotification(data.message,'error'); break; } }
  sendBtn.onclick=sendMessage; messageInput.addEventListener('keypress',e=>{if(e.key==='Enter') sendMessage();}); messageInput.addEventListener('input',onTyping); attachBtn.onclick=()=>mediaInput.click(); backBtn.onclick=()=>{document.getElementById('sidebar').classList.remove('hide'); chatArea.style.display='none';}; mediaInput.addEventListener('change',e=>{if(e.target.files[0]){ filePreview.classList.add('show'); document.querySelector('.preview-info').textContent=e.target.files[0].name; }}); searchInput.addEventListener('input',e=>{clearTimeout(window.searchTimeout); window.searchTimeout=setTimeout(()=>{if(e.target.value.trim()) searchContacts(e.target.value.trim()); else{ contactPage=1; contacts=[]; hasMoreContacts=true; lastProcessedPage=0; loadContacts(1); }},300);}); contactListEl.addEventListener('scroll',handleContactsScroll); document.addEventListener('keydown',e=>{if(e.key==='Escape') closeMediaModal();}); document.getElementById('mediaModal').addEventListener('click',function(e){if(e.target===this) closeMediaModal();}); let casePanelBtn=document.getElementById('casePanelBtn'); if(casePanelBtn) casePanelBtn.onclick=function(e){ e.preventDefault(); openCaseSidebar(); }; document.addEventListener('contextmenu',e=>{e.preventDefault(); showNotification('Right-click disabled','warning'); return false;});
  connectWebSocket();
