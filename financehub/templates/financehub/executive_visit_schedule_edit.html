<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if is_new %}Schedule a Visit{% else %}Edit Visit Schedule{% endif %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            padding-top: 80px;
        }

        .edit-card {
            max-width: 600px;
            margin: auto;
        }

        @media (max-width: 576px) {
            .edit-card {
                margin-top: 20px;
            }

            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }

            .action-buttons .btn {
                width: 100%;
            }
        }
    </style>
{% include "padmasai_brand.html" %}
</head>

<body class="bg-light">

<!-- 🚀 RESPONSIVE NAVBAR -->
{% include "financehub/_nav.html" %}

<!-- ================= CONTENT ================= -->
<div class="container">

    <div class="card shadow-sm edit-card">

        <div class="card-header bg-primary text-white text-center">
            <h5 class="mb-0">{% if is_new %}📅 Schedule a Visit{% else %}✏️ Edit Executive Visit Schedule{% endif %}</h5>
        </div>

        <div class="card-body">

            <form method="post">
                <input type="hidden" name="next" value="{{ request.GET.next }}">
                {% csrf_token %}

                <!-- Loan Number -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Loan Number
                    </label>
                    <input type="text"
                           name="loanno"
                           class="form-control"
                           value="{{ obj.loanno }}"
                           required>
                </div>

                <!-- Employee ID -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Employee ID
                    </label>
                    <input type="text"
                           name="empid"
                           class="form-control"
                           value="{{ obj.empid }}"
                           required>
                </div>

                <!-- Visit Date -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Visit Date
                    </label>
                    <input type="date"
                           name="visit_schedule_date"
                           class="form-control"
                           value="{{ obj.visit_schedule_date|date:'Y-m-d' }}"
                           required>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-between action-buttons mt-4">
                    <a href="{% url 'executive_visit_schedule_list' %}"
                       class="btn btn-secondary">
                        ← Back
                    </a>

                    <button type="submit" class="btn btn-success">
                        💾 Save Changes
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
