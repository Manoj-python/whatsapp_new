<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SPL Chats - Case Management Dashboard</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --whatsapp-green: #25D366;
      --whatsapp-dark: #075E54;
      --whatsapp-teal: #128C7E;
      --chat-bg: #E5DDD5;
      --sent-bubble: #DCF8C6;
      --received-bubble: #FFFFFF;
      --sidebar-bg: #F0F2F5;
      --esc1: #4caf50;
      --esc2: #2196f3;
      --esc3: #ff9800;
      --esc4: #9c27b0;
      --esc5: #f44336;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--chat-bg);
      height: 100vh;
      overflow: hidden;
    }

    .chat-container {
      display: flex;
      height: 100vh;
      background: var(--sidebar-bg);
      overflow: hidden;
    }

    .sidebar {
      width: 380px;
      background: white;
      border-right: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: transform 0.3s ease;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1000;
        transform: translateX(0);
      }
      .sidebar.hide {
        transform: translateX(-100%);
      }
      .chat-area {
        width: 100%;
      }
    }

    .sidebar-header {
      padding: 16px;
      background: var(--whatsapp-dark);
      color: white;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .header-top h4 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .user-badge {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: white;
    }

    .user-info-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }

    .esc-badge-compact {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.15);
      padding: 4px 12px;
      border-radius: 30px;
    }

    .esc-number {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: white;
    }

    .esc-number.level-1 { background: #4caf50; }
    .esc-number.level-2 { background: #2196f3; }
    .esc-number.level-3 { background: #ff9800; }
    .esc-number.level-4 { background: #9c27b0; }
    .esc-number.level-5 { background: #f44336; }

    .role-name {
      font-size: 12px;
      font-weight: 500;
      color: white;
    }

    .user-name-compact {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255,255,255,0.9);
    }

    .search-box {
      padding: 12px;
      background: white;
      border-bottom: 1px solid #e9ecef;
      flex-shrink: 0;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border: none;
      background: var(--sidebar-bg);
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }

    .chat-tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #e9ecef;
      padding: 0 16px;
      gap: 24px;
    }

    .chat-tab {
      padding: 12px 0;
      font-size: 15px;
      font-weight: 500;
      color: #667781;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .chat-tab.active {
      color: var(--whatsapp-green);
    }

    .chat-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--whatsapp-green);
      border-radius: 3px;
    }

    .chat-tab .badge {
      background: #dc3545;
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 12px;
      margin-left: 6px;
    }

    .contact-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid #f0f0f0;
      min-height: 72px;
      background: white;
    }

    .contact-item.active {
      background: #e8f0fe;
    }

    .contact-avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: var(--whatsapp-green);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      margin-right: 12px;
      flex-shrink: 0;
      position: relative;
    }

    .esc-level-indicator {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid white;
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .level-ESC1 { background: var(--esc1); }
    .level-ESC2 { background: var(--esc2); }
    .level-ESC3 { background: var(--esc3); }
    .level-ESC4 { background: var(--esc4); }
    .level-ESC5 { background: var(--esc5); }
    .level-RESOLVED { background: #28a745; font-size: 11px; }
    .level-CLOSED { background: #c50d1d; font-size: 11px; }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-name {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 4px;
      color: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .contact-last-msg {
      font-size: 13px;
      color: #667781;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-meta {
      text-align: right;
      flex-shrink: 0;
      min-width: 45px;
    }

    .contact-time {
      font-size: 11px;
      color: #667781;
      margin-bottom: 4px;
    }

    .unread-badge {
      background: var(--whatsapp-green);
      color: white;
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      display: inline-block;
      min-width: 20px;
      text-align: center;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--chat-bg);
      height: 100vh;
      overflow: hidden;
    }

    .chat-header {
      background: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e9ecef;
      flex-shrink: 0;
    }

    .chat-header-back {
      display: none;
      background: none;
      border: none;
      font-size: 20px;
      margin-right: 12px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
    }

    @media (max-width: 768px) {
      .chat-header-back {
        display: block;
      }
    }

    .chat-header-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--whatsapp-green);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .chat-header-info {
      flex: 1;
    }

    .chat-header-name {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 2px;
    }

    .chat-header-status {
      font-size: 12px;
      color: #667781;
    }

    .case-panel-btn {
      background: linear-gradient(135deg, #4361ee, #3f37c9);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      margin-left: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .case-panel-btn:hover {
      transform: scale(1.05);
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-row {
      display: flex;
      width: 100%;
      margin-bottom: 4px;
    }

    .message-row.sent {
      justify-content: flex-end;
    }

    .message-row.received {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 70%;
      min-width: 60px;
      padding: 8px 12px;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .message-bubble.sent {
      background: var(--sent-bubble);
      border-bottom-right-radius: 4px;
    }

    .message-bubble.received {
      background: var(--received-bubble);
      border-bottom-left-radius: 4px;
    }

    .message-text {
      font-size: 14px;
      line-height: 1.4;
      color: #111;
    }

    .message-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 4px;
      font-size: 10px;
      color: #667781;
    }

    .message-time {
      font-size: 10px;
    }

    .message-tick {
      font-size: 12px;
      margin-left: 4px;
      display: inline-block;
    }

    .message-tick.sent { color: #8696a0; }
    .message-tick.delivered { color: #25D366; font-weight: bold; }
    .message-tick.read { color: #34B7F1; font-weight: bold; }
    .message-tick.failed { color: #dc3545; }

    .message-image {
      max-width: 250px;
      max-height: 250px;
      border-radius: 8px;
      cursor: pointer;
    }

    .message-video {
      max-width: 250px;
      border-radius: 8px;
      cursor: pointer;
    }

    .composer {
      background: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #e9ecef;
    }

    .composer-input {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--sidebar-bg);
      border-radius: 24px;
      padding: 8px 16px;
    }

    .composer-input input {
      flex: 1;
      border: none;
      background: none;
      outline: none;
      font-size: 14px;
    }

    .composer button {
      background: var(--whatsapp-green);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
    }

    .case-sidebar {
      width: 350px;
      background: white;
      border-left: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      height: 100vh;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 1001;
    }

    .case-sidebar.show {
      transform: translateX(0);
    }

    .case-sidebar-header {
      padding: 16px;
      background: var(--whatsapp-dark);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .case-sidebar-header h5 {
      margin: 0;
    }

    .close-case-sidebar {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .case-sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid var(--whatsapp-green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading, .empty-state {
      text-align: center;
      padding: 40px;
      color: #667781;
    }

    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      z-index: 9999;
      animation: slideInRight 0.3s ease;
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .notification.success { background: var(--whatsapp-green); }
    .notification.error { background: #dc3545; }
    .notification.info { background: #17a2b8; }
    .notification.warning { background: #ff9800; }

    .date-separator {
      text-align: center;
      margin: 16px 0;
    }

    .date-separator span {
      background: rgba(0,0,0,0.05);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      color: #667781;
    }

    .load-older-container {
      display: flex;
      justify-content: center;
      margin: 16px 0;
      cursor: pointer;
    }

    .load-older-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--whatsapp-green);
      color: white;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 500;
    }

    .load-older-btn:hover {
      background: var(--whatsapp-teal);
    }

    .file-preview {
      background: white;
      padding: 8px 20px;
      border-top: 1px solid #e9ecef;
      display: none;
    }

    .file-preview.show {
      display: block;
    }

    .preview-card {
      background: #f8f9fa;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .preview-card i {
      font-size: 24px;
      color: var(--whatsapp-green);
    }

    .preview-info {
      flex: 1;
    }

    .preview-cancel {
      background: none;
      border: none;
      cursor: pointer;
      color: #dc3545;
      font-size: 16px;
      padding: 4px;
    }

    .typing-indicator {
      padding: 8px 20px;
      font-size: 12px;
      color: #667781;
      font-style: italic;
    }

    .media-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      display: none;
      z-index: 2000;
    }

    .media-modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 2001;
    }

    .document-bubble {
      max-width: 280px;
      background: #f0f0f0;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .document-bubble:hover {
      background: #e5e5e5;
    }

    .document-content {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
    }

    .document-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 10px;
    }

    .document-icon i {
      font-size: 22px;
    }

    .document-details {
      flex: 1;
      min-width: 0;
    }

    .document-filename {
      font-size: 13px;
      font-weight: 500;
      color: #111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .document-download {
      flex-shrink: 0;
      color: #8696a0;
      font-size: 14px;
      padding: 6px;
      border-radius: 50%;
    }

    .doc-text {
      margin-top: 6px;
      font-size: 13px;
      color: #111;
    }

    .message-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
      font-size: 10px;
      flex-wrap: wrap;
    }

    .message-sender {
      font-weight: 600;
      color: #075E54;
      font-size: 10px;
    }

    .message-row.received .message-sender {
      color: #128C7E;
    }

    @media (max-width: 768px) {
      .message-bubble { max-width: 85%; min-width: 50px; padding: 6px 10px; }
      .message-image { max-width: 100%; max-height: 200px; }
      .message-video { max-width: 100%; max-height: 200px; }
      .document-bubble { max-width: 100%; min-width: 200px; }
      .composer { padding: 8px 12px; gap: 8px; }
      .composer-input { padding: 6px 12px; }
      .composer button { width: 35px; height: 35px; }
      .chat-header { padding: 10px 15px; }
      .chat-header-avatar { width: 35px; height: 35px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="header-top">
          <h4 onclick="goToDashboard()" style="cursor: pointer;">
            <i class="fab fa-whatsapp"></i> SPL Chats
          </h4>
          <span class="esc-number">{{ agent.level|default:"ESC1" }}</span>
          <span class="role-name">{{ agent.role|default:"Agent" }}</span>
          <div class="user-badge">{{ request.user.username|slice:":2"|upper }}</div>
        </div>
      </div>
      <div class="chat-tabs">
        <div class="chat-tab active" data-filter="all" onclick="switchTab('all')">All</div>
        <div class="chat-tab" data-filter="unread" onclick="switchTab('unread')">
          Unread
          <span class="badge" id="unreadCountBadge" style="display: none;">0</span>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search contacts..." autocomplete="off">
      </div>
      <div class="contact-list" id="contactList">
        <div class="loading">Loading contacts...</div>
      </div>
    </div>

    <div class="chat-area" id="chatArea" style="display: none;">
      <div class="chat-header">
        <button class="chat-header-back" id="backBtn"><i class="fas fa-arrow-left"></i></button>
        <div class="chat-header-avatar" id="headerAvatar">👤</div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="headerName">Select a chat</div>
          <div class="chat-header-status" id="headerStatus"></div>
        </div>
        <button class="case-panel-btn" id="casePanelBtn" title="View Case Details">
          <i class="fas fa-folder-open"></i>
        </button>
      </div>

      <div class="messages-container" id="messagesContainer">
        <div class="empty-state">Select a contact to start chatting</div>
      </div>

      <div class="typing-indicator" id="typingIndicator" style="display: none;">Typing...</div>

      <div class="composer" style="display: none;">
        <div class="composer-input">
          <button id="attachBtn"><i class="fas fa-paperclip"></i></button>
          <input type="text" id="messageInput" placeholder="Type a message...">
        </div>
        <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        <input type="file" id="mediaInput" style="display: none;" accept="image/*,video/*,audio/*,.pdf,.doc,.docx">
      </div>

      <div class="file-preview" id="filePreview">
        <div class="preview-card">
          <i class="fas fa-file"></i>
          <div class="preview-info">No file selected</div>
          <button class="preview-cancel" onclick="cancelFile()">✖</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Case Panel Sidebar -->
  <div class="case-sidebar" id="caseSidebar">
    <div class="case-sidebar-header">
      <h5><i class="fas fa-folder-open"></i> Case Details</h5>
      <button class="close-case-sidebar" onclick="closeCaseSidebar()">×</button>
    </div>
    <div class="case-sidebar-content" id="caseSidebarContent">
      <div class="text-center py-4">
        <div class="loading-spinner"></div>
        <p class="mt-2">Loading case details...</p>
      </div>
    </div>
  </div>

  <div id="mediaModal" class="media-modal">
    <button class="modal-close" onclick="closeMediaModal()">×</button>
    <div id="mediaContent"></div>
  </div>

  <script>
    // ============================================
    // CONFIGURATION – SMS App
    // ============================================
    const CSRF = document.querySelector('meta[name="csrf-token"]').content;
    const APP_KEY = 'sms';  // This chat is for SMS app

    // Helper to add app parameter to API calls
    function addAppParam(url) {
      const separator = url.includes('?') ? '&' : '?';
      return `${url}${separator}app=${APP_KEY}`;
    }

    let ws = null;
    let selectedMobile = null;
    let contacts = [];
    let messages = [];
    let isLoadingMessages = false;
    let hasMoreMessages = true;
    let reconnectAttempts = 0;
    let typingTimeout = null;
    let nextCursorDate = null;
    let initialLoadDone = false;
    let currentFilter = 'all';
    let totalUnreadCount = 0;
    let contactPage = 1;
    let isLoadingContacts = false;
    let hasMoreContacts = true;
    let lastProcessedPage = 0;
    let isRenderingContacts = false;
    let scrollTimeout = null;
    let currentCaseData = null;

    // User details from Django template
    let currentUser = {

    window.escalateCase = async function() {
      const levelSelect = document.getElementById('escalateLevelSelect');
      const reasonText = document.getElementById('escalateReasonText');
      const loanText = document.getElementById('escalateLoanNumber');
      const nameText = document.getElementById('escalateCustomerName');
      if (!levelSelect || !reasonText || !loanText || !nameText) {
        showNotification('Form elements not found', 'error');
        return;
      }
      const level = levelSelect.value;
      const reason = reasonText.value;
      const loan = loanText.value;
      const name = nameText.value;
      if (!level || !reason || !loan || !name) {
        showNotification('Please fill all fields', 'warning');
        return;
      }
      try {
        const response = await fetch(addAppParam(`/messaging2/case/${currentCaseData.case_id}/escalate/`), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
          body: JSON.stringify({ new_level: level, reason: reason, loan: loan, name: name, escalated_by: currentUser.name })
        });
        const data = await response.json();
        if (data.success) {
          showNotification(`Case escalated to ${level} successfully!`, 'success');
          closeCaseSidebar();
          await loadCaseForMobile(selectedMobile);
          await renderCasePanel();
        } else {
          showNotification(data.error || 'Escalation failed', 'error');
        }
      } catch (error) {
        showNotification('Error escalating case: ' + error.message, 'error');
      }
    };

    // ============================================
    // WEBSOCKET (SMS specific)
    // ============================================
    function showNotification(message, type = 'info') {
      const existing = document.querySelector('.notification');
      if (existing) existing.remove();
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
      document.body.appendChild(notification);
      setTimeout(() => notification.remove(), 3000);
    }

    function connectWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${scheme}://${location.host}/ws/chat_spl/`);  // SMS uses /ws/chat/
      ws.onopen = () => {
        console.log('WebSocket connected (SMS)');
        reconnectAttempts = 0;
        showNotification('Connected to chat server', 'success');
        lastProcessedPage = 0;
        contactPage = 1;
        contacts = [];
        loadContacts();
      };
      ws.onmessage = (e) => {
        try {
          handleWebSocketMessage(JSON.parse(e.data));
        } catch (err) { console.error('WebSocket parse error:', err); }
      };
      ws.onclose = () => {
        console.log('WebSocket disconnected');
        showNotification('Disconnected from server, reconnecting...', 'info');
        setTimeout(() => { if (reconnectAttempts < 10) { reconnectAttempts++; connectWebSocket(); } }, 3000);
      };
      ws.onerror = (error) => { console.error('WebSocket error:', error); showNotification('Connection error', 'error'); };
    }

    function sendWS(data) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(data));
      else console.warn('WebSocket not connected');
    }

    function switchTab(filter) {
      if (currentFilter === filter) return;
      currentFilter = filter;
      document.querySelectorAll('.chat-tab').forEach(tab => {
        if (tab.dataset.filter === filter) tab.classList.add('active');
        else tab.classList.remove('active');
      });
      contactPage = 1;
      contacts = [];
      hasMoreContacts = true;
      lastProcessedPage = 0;
      contactListEl.innerHTML = '<div class="loading">Loading contacts...</div>';
      loadContacts();
    }

    function loadContacts(page = 1) {
      if (isLoadingContacts) return;
      if (page <= contactPage && page > 1) return;
      isLoadingContacts = true;
      let levelToSend = currentUser.role === 'ADMIN' ? null : currentUser.level;
      sendWS({ type: 'get_contacts', page: page, filter: currentFilter, level: levelToSend });
    }

    function searchContacts(query) {
      contactPage = 1;
      contacts = [];
      hasMoreContacts = true;
      lastProcessedPage = 0;
      let levelToSend = currentUser.role === 'ADMIN' ? null : currentUser.level;
      sendWS({ type: 'search_contacts', q: query, filter: currentFilter, level: levelToSend });
    }

    function renderContacts(contactsData, replace = true, unreadCount = 0, hasMore = false, currentPage = 1) {
      if (isRenderingContacts) return;
      isRenderingContacts = true;
      isLoadingContacts = false;
      if (lastProcessedPage === currentPage && !replace) { isRenderingContacts = false; return; }
      lastProcessedPage = currentPage;

      let filteredContacts = contactsData;
      if (currentUser.role !== 'AGENT' && currentUser.role !== 'ADMIN') {
        filteredContacts = contactsData.filter(contact => contact.current_level === currentUser.level);
      }
      if (replace) contacts = filteredContacts;
      else {
        const existingMobiles = new Set(contacts.map(c => c.mobile));
        const newContacts = filteredContacts.filter(c => !existingMobiles.has(c.mobile));
        contacts = [...contacts, ...newContacts];
      }
      totalUnreadCount = unreadCount;
      const badge = document.getElementById('unreadCountBadge');
      if (badge) {
        if (totalUnreadCount > 0) { badge.style.display = 'inline'; badge.textContent = totalUnreadCount; }
        else badge.style.display = 'none';
      }
      if (contacts.length === 0) {
        let emptyMsg = (currentUser.role !== 'AGENT' && currentUser.role !== 'ADMIN') ? `No chats at ${currentUser.level} level` : (currentFilter === 'unread' ? 'No unread messages' : 'No contacts found');
        contactListEl.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
        isRenderingContacts = false; return;
      }
      let html = '';
      for (const contact of contacts) {
        if (currentFilter === 'unread' && (!contact.last_msg || contact.last_msg === 'No messages yet' || contact.unread === 0)) continue;
        let lastMsg = contact.last_msg || 'No messages yet';
        if (lastMsg.length > 50) lastMsg = lastMsg.substring(0, 47) + '...';
        const levelClass = contact.current_level || 'ESC1';
        let indicatorContent = '';
        let levelColorClass = '';
        if (levelClass === 'RESOLVED') { indicatorContent = '✓'; levelColorClass = 'level-RESOLVED'; }
        else if (levelClass === 'CLOSED') { indicatorContent = '🔒'; levelColorClass = 'level-CLOSED'; }
        else { indicatorContent = levelClass.replace('ESC', ''); levelColorClass = `level-${levelClass}`; }
        html += `
          <div class="contact-item ${selectedMobile === contact.mobile ? 'active' : ''}" data-mobile="${contact.mobile}" onclick="selectContact('${contact.mobile.replace(/'/g, "\\'")}')">
            <div class="contact-avatar">${contact.mobile.slice(-2)}<div class="esc-level-indicator ${levelColorClass}">${indicatorContent}</div></div>
            <div class="contact-info"><div class="contact-name">${escapeHtml(contact.mobile)}${contact.unread > 0 ? `<span class="unread-badge">${contact.unread}</span>` : ''}</div><div class="contact-last-msg">${escapeHtml(lastMsg)}</div></div>
            <div class="contact-meta">${contact.last_time ? `<div class="contact-time">${formatTime(contact.last_time)}</div>` : ''}</div>
          </div>
        `;
      }
      contactListEl.innerHTML = html;
      if (hasMore) addContactsLoadingIndicator(); else removeContactsLoadingIndicator();
      hasMoreContacts = hasMore;
      contactPage = currentPage;
      isRenderingContacts = false;
    }

    function addContactsLoadingIndicator() {
      removeContactsLoadingIndicator();
      const loader = document.createElement('div');
      loader.id = 'contactsLoadingIndicator';
      loader.className = 'contacts-loading';
      loader.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading more contacts...';
      contactListEl.appendChild(loader);
    }
    function removeContactsLoadingIndicator() { const existing = document.getElementById('contactsLoadingIndicator'); if (existing) existing.remove(); }
    function handleContactsScroll() {
      if (!hasMoreContacts || isLoadingContacts) return;
      if (scrollTimeout) clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        const scrollTop = contactListEl.scrollTop, scrollHeight = contactListEl.scrollHeight, clientHeight = contactListEl.clientHeight;
        if (scrollTop + clientHeight >= scrollHeight - 200) loadContacts(contactPage + 1);
      }, 200);
    }

    function updateContactInList(contact) {
      const index = contacts.findIndex(c => c.mobile === contact.mobile);
      if (index !== -1) contacts[index] = { ...contacts[index], ...contact };
      else contacts.push(contact);
      contacts.sort((a,b) => { if (!a.last_time) return 1; if (!b.last_time) return -1; return new Date(b.last_time) - new Date(a.last_time); });
      renderContacts(contacts, true, totalUnreadCount, hasMoreContacts, contactPage);
    }

    function selectContact(mobile) {
      if (selectedMobile === mobile) return;
      selectedMobile = mobile;
      document.querySelectorAll('.contact-item').forEach(el => {
        if (el.dataset.mobile === mobile) el.classList.add('active');
        else el.classList.remove('active');
      });
      if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('hide');
      chatArea.style.display = 'flex';
      composer.style.display = 'flex';
      headerName.textContent = mobile;
      headerAvatar.textContent = mobile.slice(-2);
      loadCaseForMobile(mobile);
      messages = [];
      hasMoreMessages = true;
      isLoadingMessages = false;
      nextCursorDate = null;
      initialLoadDone = false;
      messagesContainer.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading messages...</div>';
      sendWS({ type: 'join', mobile: mobile });
      sendWS({ type: 'get_messages', mobile: mobile, limit: 30 });
      sendWS({ type: 'mark_read', mobile: mobile });
      setTimeout(async () => {
        if (messages.length === 0 && messagesContainer.innerHTML.includes('Loading')) {
          try {
            const response = await fetch(`/splcases_app/api/contact-messages3/?mobile=${encodeURIComponent(mobile)}`);
            const data = await response.json();
            if (data.messages && data.messages.length > 0) renderMessages(data.messages, false, null, true);
          } catch(err) { console.error('REST API failed:', err); }
        }
      }, 3000);
    }

    // Message rendering functions (same as PSF chat)
    function isSameDay(date1, date2) { return date1.getDate() === date2.getDate() && date1.getMonth() === date2.getMonth() && date1.getFullYear() === date2.getFullYear(); }
    function formatMessageDate(date) {
      const today = new Date();
      const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
      const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const yesterdayDate = new Date(yesterday.getFullYear(), yesterday.getMonth(), yesterday.getDate());
      const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      if (msgDate.getTime() === todayDate.getTime()) return 'Today';
      if (msgDate.getTime() === yesterdayDate.getTime()) return 'Yesterday';
      const options = { day: 'numeric', month: 'long', year: date.getFullYear() !== today.getFullYear() ? 'numeric' : undefined };
      return date.toLocaleDateString('en-IN', options);
    }

    function renderMessages(messagesData, hasMore, nextCursorDateParam, isInitial = false) {
      if (messagesData.length === 0 && messages.length === 0) { messagesContainer.innerHTML = '<div class="empty-state">No messages yet</div>'; return; }
      hasMoreMessages = hasMore;
      nextCursorDate = nextCursorDateParam;
      const sortedMessages = [...messagesData].sort((a,b) => new Date(a.sent_at) - new Date(b.sent_at));
      let newMessages = [];
      if (isInitial || messages.length === 0) newMessages = sortedMessages;
      else {
        const existingIds = new Set(messages.map(m => m.message_id || m.id));
        const uniqueNewMessages = sortedMessages.filter(m => !existingIds.has(m.message_id || m.id));
        newMessages = [...uniqueNewMessages, ...messages];
      }
      let lastDate = null, html = '';
      for (const msg of newMessages) {
        const msgDate = new Date(msg.sent_at);
        const currentDateLabel = formatMessageDate(msgDate);
        if (lastDate !== currentDateLabel) { html += `<div class="date-separator"><span>${currentDateLabel}</span></div>`; lastDate = currentDateLabel; }
        html += renderMessage(msg);
      }
      if (isInitial || messages.length === 0) {
        messages = newMessages;
        messagesContainer.innerHTML = html;
        if (hasMoreMessages) addLoadOlderButton(); else removeLoadOlderButton();
        scrollToBottom();
      } else {
        const oldScrollHeight = messagesContainer.scrollHeight;
        messages = newMessages;
        messagesContainer.innerHTML = html;
        messagesContainer.scrollTop = messagesContainer.scrollHeight - oldScrollHeight;
        if (hasMoreMessages) addLoadOlderButton(); else removeLoadOlderButton();
      }
      isLoadingMessages = false;
    }

    function renderMessage(msg) {
      const isSent = msg.message_type === 'Sent';
      let timeDisplay = '';
      try {
        const sentDate = new Date(msg.sent_at);
        if (!isNaN(sentDate.getTime())) timeDisplay = sentDate.toLocaleString('en-IN', { day:'2-digit', month:'short', year:'2-digit', hour:'2-digit', minute:'2-digit', hour12:true });
        else timeDisplay = 'Just now';
      } catch(e) { timeDisplay = 'Just now'; }
      let senderName = '';
      if (isSent) senderName = msg.sender_name || 'Agent';
      else senderName = msg.sender_name || msg.customer_name || 'Customer';
      let contentHtml = '';
      if (msg.content_type === 'image' && msg.media_file) contentHtml = `<img src="${msg.media_file}" class="message-image" onclick="openMedia('${msg.media_file}', 'image')">${msg.sent_text_message ? `<div class="message-text">${escapeHtml(msg.sent_text_message)}</div>` : ''}`;
      else if (msg.content_type === 'video' && msg.media_file) contentHtml = `<video class="message-video" onclick="openMedia('${msg.media_file}', 'video')"><source src="${msg.media_file}"></video>${msg.sent_text_message ? `<div class="message-text">${escapeHtml(msg.sent_text_message)}</div>` : ''}`;
      else if (msg.content_type === 'audio' && msg.media_file) contentHtml = `<audio controls src="${msg.media_file}"></audio>${msg.sent_text_message ? `<div class="message-text">${escapeHtml(msg.sent_text_message)}</div>` : ''}`;
      else if (msg.content_type === 'document' && msg.media_file) {
        let fileName = msg.media_file.split('/').pop().split('?')[0];
        fileName = decodeURIComponent(fileName);
        const isNoc = fileName.toLowerCase().includes('noc');
        let displayName = fileName;
        if (fileName.length > 30) { const nameParts = fileName.split('.'); const ext = nameParts.pop(); const name = nameParts.join('.'); displayName = name.substring(0,25)+'...'+ext; }
        const fileExt = fileName.split('.').pop().toLowerCase();
        let fileIcon = 'fa-file-pdf', iconColor = '#dc4a2c', fileTypeName = 'PDF';
        const fileTypes = { 'doc':{icon:'fa-file-word',color:'#2b579a',name:'Word Document'}, 'docx':{icon:'fa-file-word',color:'#2b579a',name:'Word Document'}, 'xls':{icon:'fa-file-excel',color:'#1e7145',name:'Excel Spreadsheet'}, 'xlsx':{icon:'fa-file-excel',color:'#1e7145',name:'Excel Spreadsheet'}, 'ppt':{icon:'fa-file-powerpoint',color:'#d35230',name:'PowerPoint Presentation'}, 'pptx':{icon:'fa-file-powerpoint',color:'#d35230',name:'PowerPoint Presentation'}, 'jpg':{icon:'fa-file-image',color:'#f39c12',name:'Image'}, 'jpeg':{icon:'fa-file-image',color:'#f39c12',name:'Image'}, 'png':{icon:'fa-file-image',color:'#f39c12',name:'Image'}, 'gif':{icon:'fa-file-image',color:'#f39c12',name:'Image'}, 'mp4':{icon:'fa-file-video',color:'#27ae60',name:'Video'}, 'mov':{icon:'fa-file-video',color:'#27ae60',name:'Video'}, 'mp3':{icon:'fa-file-audio',color:'#e67e22',name:'Audio'}, 'wav':{icon:'fa-file-audio',color:'#e67e22',name:'Audio'}, 'zip':{icon:'fa-file-archive',color:'#f1c40f',name:'Archive'}, 'rar':{icon:'fa-file-archive',color:'#f1c40f',name:'Archive'}, 'pdf':{icon:'fa-file-pdf',color:'#dc4a2c',name:'PDF Document'}, 'txt':{icon:'fa-file-alt',color:'#3498db',name:'Text File'} };
        if (fileTypes[fileExt]) { fileIcon = fileTypes[fileExt].icon; iconColor = fileTypes[fileExt].color; fileTypeName = fileTypes[fileExt].name; }
        if (isNoc) {
          contentHtml = `<div class="document-bubble noc-document" data-msg-id="${msg.id}" style="cursor: default; background: linear-gradient(135deg,#f5f5f5 0%,#e0e0e0 100%); border-left:4px solid #dc3545; border-radius:12px; opacity:0.7;"><div class="document-content" style="display:flex; align-items:center; gap:12px; padding:12px;"><div class="document-icon" style="position:relative; flex-shrink:0; width:48px; height:48px; display:flex; align-items:center; justify-content:center; background:#dc3545; border-radius:12px;"><i class="fas fa-file-contract" style="color:white; font-size:22px;"></i><i class="fas fa-lock" style="color:white; font-size:10px; position:absolute; bottom:-2px; right:-2px; background:#721c24; border-radius:50%; padding:2px;"></i></div><div class="document-details" style="flex:1; min-width:0;"><div class="document-filename" style="font-size:13px; font-weight:600; color:#dc3545; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px;">🔒 NOC Document (Restricted)</div><div class="document-meta" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;"><span class="document-type" style="background:#dc3545; color:white; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:500;"><i class="fas fa-ban" style="font-size:10px;"></i> Cannot View</span><span style="font-size:10px; color:#dc3545;"><i class="fas fa-lock"></i> Restricted Access</span></div></div><div class="document-download" style="flex-shrink:0; width:32px; height:32px; display:flex; align-items:center; justify-content:center; background:#dc3545; border-radius:50%; opacity:0.5;"><i class="fas fa-lock" style="color:white; font-size:12px;"></i></div></div></div>${msg.sent_text_message ? `<div class="doc-text" style="margin-top:8px; padding:8px 12px; background:#ffe5e5; border-radius:8px; font-size:12px; color:#dc3545; border-left:3px solid #dc3545;">⚠️ NOC Document: ${escapeHtml(msg.sent_text_message)}</div>` : ''}`;
        } else {
          contentHtml = `<div class="document-bubble" onclick="downloadDocument('${msg.media_file}', '${escapeHtml(fileName)}', event)" style="cursor:pointer; background:white; border-radius:12px; box-shadow:0 1px 2px rgba(0,0,0,0.05); transition:all 0.2s ease;"><div class="document-content" style="display:flex; align-items:center; gap:12px; padding:10px 12px;"><div class="document-icon" style="flex-shrink:0; width:40px; height:40px; display:flex; align-items:center; justify-content:center; background:${iconColor}15; border-radius:10px;"><i class="fas ${fileIcon}" style="color:${iconColor}; font-size:20px;"></i></div><div class="document-details" style="flex:1; min-width:0;"><div class="document-filename" style="font-size:13px; font-weight:500; color:#111; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px;">${escapeHtml(displayName)}</div><div class="document-meta" style="display:flex; align-items:center; gap:6px;"><span class="document-type" style="font-size:10px; color:#667781;">${fileTypeName}</span><span style="font-size:10px; color:#25D366;"><i class="fas fa-download"></i> Click to download</span></div></div><div class="document-download" style="flex-shrink:0; width:28px; height:28px; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.05); border-radius:50%; transition:all 0.2s ease;"><i class="fas fa-download" style="color:${iconColor}; font-size:12px;"></i></div></div></div>${msg.sent_text_message ? `<div class="doc-text" style="margin-top:6px; font-size:12px; color:#555; line-height:1.4;">${escapeHtml(msg.sent_text_message)}</div>` : ''}`;
        }
      } else {
        contentHtml = `<div class="message-text">${escapeHtml(msg.sent_text_message || '')}</div>`;
      }
      let tickHtml = '';
      const messageId = msg.message_id || msg.id;
      if (isSent) {
        if (msg.status === 'Read') tickHtml = `<span class="message-tick read" data-msg-id="${messageId}">✓✓</span>`;
        else if (msg.status === 'Delivered') tickHtml = `<span class="message-tick delivered" data-msg-id="${messageId}">✓✓</span>`;
        else if (msg.status === 'Failed' || msg.status === 'Blocked' || msg.status === 'Invalid' || msg.status === 'Re-engagement Required') tickHtml = `<span class="message-tick failed" data-msg-id="${messageId}" title="${msg.status}">❌</span>`;
        else tickHtml = `<span class="message-tick sent" data-msg-id="${messageId}">✓</span>`;
      }
      return `<div class="message-row ${isSent ? 'sent' : 'received'}" data-msg-id="${messageId}"><div class="message-bubble ${isSent ? 'sent' : 'received'}">${contentHtml}<div class="message-footer"><span class="message-sender">${escapeHtml(senderName)}</span><span class="message-time">${timeDisplay}</span>${tickHtml}</div></div></div>`;
    }

    function appendMessage(msg) {
      const wasAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 100;
      let needDateSeparator = false, newDateLabel = null;
      if (messages.length > 0) {
        const lastMsg = messages[messages.length-1];
        if (!isSameDay(new Date(lastMsg.sent_at), new Date(msg.sent_at))) { needDateSeparator = true; newDateLabel = formatMessageDate(new Date(msg.sent_at)); }
      } else { needDateSeparator = true; newDateLabel = formatMessageDate(new Date(msg.sent_at)); }
      messages.push(msg);
      let newHtml = '';
      if (needDateSeparator) newHtml = `<div class="date-separator"><span>${newDateLabel}</span></div>`;
      newHtml += renderMessage(msg);
      messagesContainer.insertAdjacentHTML('beforeend', newHtml);
      if (wasAtBottom) scrollToBottom();
    }

    function updateMessageTickImproved(messageId, status) {
      if (!messageId || messageId === "") { console.warn("Ignoring empty message_id"); return; }
      if (status === 'Failed' || status === 'Blocked' || status === 'Invalid' || status === 'Re-engagement Required') {
        let updated = false;
        const sentMessages = document.querySelectorAll('.message-row.sent');
        for (let i = sentMessages.length-1; i >=0; i--) {
          const tick = sentMessages[i].querySelector('.message-tick');
          if (tick && !tick.classList.contains('delivered') && !tick.classList.contains('read') && !tick.classList.contains('failed')) {
            tick.innerHTML = '❌'; tick.className = 'message-tick failed'; tick.style.color = '#dc3545'; tick.title = status;
            if (messageId) tick.setAttribute('data-msg-id', messageId);
            updated = true; break;
          }
        }
        if (!updated) console.warn('Could not find sent message to mark failed');
        showNotification(`Message ${status.toLowerCase()}`, 'error');
        return;
      }
      let tickSpan = document.querySelector(`.message-tick[data-msg-id="${messageId}"]`);
      if (!tickSpan) {
        const messageRow = document.querySelector(`.message-row[data-msg-id="${messageId}"]`);
        if (messageRow) tickSpan = messageRow.querySelector('.message-tick');
      }
      if (tickSpan && !tickSpan.classList.contains('failed')) {
        tickSpan.className = 'message-tick';
        if (status === 'Read') { tickSpan.textContent = '✓✓'; tickSpan.classList.add('read'); tickSpan.style.color = '#34B7F1'; }
        else if (status === 'Delivered') { tickSpan.textContent = '✓✓'; tickSpan.classList.add('delivered'); tickSpan.style.color = '#25D366'; }
        else if (status === 'Sent') { tickSpan.textContent = '✓'; tickSpan.classList.add('sent'); tickSpan.style.color = '#8696a0'; }
        if (messageId) tickSpan.setAttribute('data-msg-id', messageId);
      }
    }

    function addLoadOlderButton() {
      removeLoadOlderButton();
      const loadButton = document.createElement('div');
      loadButton.id = 'loadOlderButton';
      loadButton.className = 'load-older-container';
      loadButton.innerHTML = `<div class="load-older-btn"><i class="fas fa-chevron-up"></i><span>Load Older Messages</span></div>`;
      loadButton.onclick = loadOlderMessages;
      if (messagesContainer.firstChild) messagesContainer.insertBefore(loadButton, messagesContainer.firstChild);
      else messagesContainer.appendChild(loadButton);
    }
    function removeLoadOlderButton() { const existing = document.getElementById('loadOlderButton'); if (existing) existing.remove(); }
    function loadOlderMessages() {
      if (isLoadingMessages || !hasMoreMessages) return;
      isLoadingMessages = true;
      if (messages.length > 0) {
        const oldestMessage = messages[0];
        const beforeDate = oldestMessage.sent_at;
        const loadButton = document.getElementById('loadOlderButton');
        if (loadButton) { loadButton.innerHTML = `<div class="load-older-btn loading"><i class="fas fa-spinner fa-spin"></i><span>Loading...</span></div>`; loadButton.onclick = null; }
        sendWS({ type: 'get_messages', mobile: selectedMobile, before_date: beforeDate, limit: 30 });
      } else isLoadingMessages = false;
    }
    function scrollToBottom() { setTimeout(() => messagesContainer.scrollTop = messagesContainer.scrollHeight, 100); }

    async function sendMessage() {
      const text = messageInput.value.trim();
      const file = mediaInput.files[0];
      if (!selectedMobile) { showNotification('Select a contact first', 'error'); return; }
      if (!text && !file) { showNotification('Enter a message or select a file', 'error'); return; }
      if (file) {
        const fileSizeMB = file.size / (1024*1024);
        const fileType = file.type.split('/')[0];
        let maxSize = 16;
        if (fileType === 'image') maxSize = 5;
        if (fileType === 'video') maxSize = 16;
        if (fileType === 'audio') maxSize = 16;
        if (fileSizeMB > maxSize) { showNotification(`File too large! Max ${maxSize}MB. Yours: ${fileSizeMB.toFixed(2)}MB`, 'error'); mediaInput.value = ''; cancelFile(); return; }
      }
      const originalBtnHtml = sendBtn.innerHTML;
      sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      sendBtn.disabled = true;
      try {
        if (file) {
          const formData = new FormData();
          formData.append('mobile', selectedMobile);
          formData.append('text', text);
          formData.append('media', file);
          const response = await fetch('/splcases_app/api/send-reply3/', { method: 'POST', headers: { 'X-CSRFToken': CSRF }, body: formData });
          const result = await response.json();
          if (result.status === 'ok') { showNotification('Message sent successfully!', 'success'); messageInput.value = ''; mediaInput.value = ''; cancelFile(); }
          else showNotification('Failed to send', 'error');
        } else if (text) {
          sendWS({ type: 'send_message', mobile: selectedMobile, text: text, content_type: 'text' });
          messageInput.value = '';
          showNotification('Message sent!', 'success');
        }
      } catch (error) { showNotification(`Error: ${error.message}`, 'error'); }
      finally { sendBtn.innerHTML = originalBtnHtml; sendBtn.disabled = false; }
    }
    function onTyping() { if (!selectedMobile) return; sendWS({ type: 'typing', mobile: selectedMobile, state: true }); clearTimeout(typingTimeout); typingTimeout = setTimeout(() => sendWS({ type: 'typing', mobile: selectedMobile, state: false }), 1000); }
    function cancelFile() { mediaInput.value = ''; filePreview.classList.remove('show'); document.querySelector('.preview-info').textContent = 'No file selected'; }

    let zoomLevel = 1;
    function openMedia(src, type) {
      const modal = document.getElementById('mediaModal');
      const content = document.getElementById('mediaContent');
      if (type === 'image') {
        content.innerHTML = `<img id="modalImage" src="${src}" style="max-width:100%; max-height:90vh; object-fit:contain; transform:scale(1); transition:transform 0.2s; cursor:zoom-in;">`;
        zoomLevel = 1;
        const img = document.getElementById('modalImage');
        img.onwheel = function(e) { e.preventDefault(); zoomLevel += e.deltaY < 0 ? 0.1 : -0.1; zoomLevel = Math.max(0.5, Math.min(zoomLevel, 3)); img.style.transform = `scale(${zoomLevel})`; };
        img.ondblclick = function() { zoomLevel = zoomLevel === 1 ? 2 : 1; img.style.transform = `scale(${zoomLevel})`; };
      } else { content.innerHTML = `<video src="${src}" controls autoplay style="max-width:100%; max-height:90vh;"></video>`; }
      modal.classList.add('show');
    }
    function closeMediaModal() { document.getElementById('mediaModal').classList.remove('show'); document.getElementById('mediaContent').innerHTML = ''; zoomLevel = 1; }
    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    function formatTime(isoString) {
      const date = new Date(isoString);
      const now = new Date();
      const diff = now - date;
      if (diff < 86400000) return date.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
      else if (diff < 604800000) return date.toLocaleDateString('en-IN', { weekday:'short' });
      else return date.toLocaleDateString('en-IN', { day:'2-digit', month:'2-digit' });
    }

    function handleWebSocketMessage(data) {
      switch(data.type) {
        case 'contacts.page': renderContacts(data.contacts, data.page===1, data.unread_count, data.has_more, data.page); break;
        case 'messages.page':
          if (data.mobile === selectedMobile && data.messages) renderMessages(data.messages, data.has_more, data.next_cursor_date, data.is_initial===true || messages.length===0);
          break;
        case 'new.message':
          if (data.message.mobile === selectedMobile) appendMessage(data.message);
          updateContactInList(data.message);
          break;
        case 'delivery.update':
          updateMessageTickImproved(data.message_id, data.status);
          if (data.mobile) updateContactInList({ mobile: data.mobile, last_status: data.status });
          break;
        case 'unread.update':
          if (data.unread_count !== undefined) {
            totalUnreadCount = data.unread_count;
            const badge = document.getElementById('unreadCountBadge');
            if (badge) badge.style.display = totalUnreadCount > 0 ? 'inline' : 'none';
            if (currentFilter === 'unread') loadContacts(1);
          }
          break;
        case 'contact.update':
          if (data.contact) {
            const existing = contacts.find(c => c.mobile === data.contact.mobile);
            if (existing && !data.contact.last_time) data.contact.last_time = existing.last_time;
            updateContactInList(data.contact);
          }
          break;
        case 'typing':
          if (data.mobile === selectedMobile) typingIndicator.style.display = data.state ? 'block' : 'none';
          break;
        case 'error': showNotification(data.message, 'error'); break;
      }
    }

    // Event listeners
    sendBtn.onclick = sendMessage;
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    messageInput.addEventListener('input', onTyping);
    attachBtn.onclick = () => mediaInput.click();
    backBtn.onclick = () => { document.getElementById('sidebar').classList.remove('hide'); chatArea.style.display = 'none'; };
    mediaInput.addEventListener('change', (e) => { const file = e.target.files[0]; if (file) { filePreview.classList.add('show'); document.querySelector('.preview-info').textContent = file.name; } });
    searchInput.addEventListener('input', (e) => { clearTimeout(window.searchTimeout); window.searchTimeout = setTimeout(() => { if (e.target.value.trim()) searchContacts(e.target.value.trim()); else { contactPage=1; contacts=[]; hasMoreContacts=true; lastProcessedPage=0; loadContacts(1); } }, 300); });
    contactListEl.addEventListener('scroll', handleContactsScroll);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMediaModal(); });
    document.getElementById('mediaModal').addEventListener('click', function(e) { if (e.target === this) closeMediaModal(); });
    const casePanelBtn = document.getElementById('casePanelBtn');
    if (casePanelBtn) casePanelBtn.onclick = (e) => { e.preventDefault(); openCaseSidebar(); };
    document.addEventListener('contextmenu', (event) => { event.preventDefault(); showNotification('Right-click is disabled on this page', 'warning'); return false; });

    connectWebSocket();
  </script>
</body>
</html>
