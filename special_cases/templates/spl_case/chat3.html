<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SMSQUARE - Chat Dashboard</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --whatsapp-green: #25D366;
      --whatsapp-dark: #075E54;
      --whatsapp-teal: #128C7E;
      --chat-bg: #E5DDD5;
      --sent-bubble: #DCF8C6;
      --received-bubble: #FFFFFF;
      --sidebar-bg: #F0F2F5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--chat-bg);
      height: 100vh;
      overflow: hidden;
    }

    .chat-container {
      display: flex;
      height: 100vh;
      background: var(--sidebar-bg);
      overflow: hidden;
    }

    .sidebar {
      width: 380px;
      background: white;
      border-right: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: transform 0.3s ease;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1000;
        transform: translateX(0);
      }
      .sidebar.hide {
        transform: translateX(-100%);
      }
      .chat-area {
        width: 100%;
      }
    }

    .sidebar-header {
      padding: 16px;
      background: var(--whatsapp-dark);
      color: white;
      flex-shrink: 0;
    }

    .sidebar-header h4 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .search-box {
      padding: 12px;
      background: white;
      border-bottom: 1px solid #e9ecef;
      flex-shrink: 0;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border: none;
      background: var(--sidebar-bg);
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }

    .chat-tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #e9ecef;
      padding: 0 16px;
      gap: 24px;
    }

    .chat-tab {
      padding: 12px 0;
      font-size: 15px;
      font-weight: 500;
      color: #667781;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .chat-tab.active {
      color: var(--whatsapp-green);
    }

    .chat-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--whatsapp-green);
      border-radius: 3px;
    }

    .chat-tab:hover {
      color: var(--whatsapp-dark);
    }

    .chat-tab .badge {
      background: #dc3545;
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 12px;
      margin-left: 6px;
    }

/* Prevent layout shifts */
.contact-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    contain: content; /* Prevents layout recalc outside */
    will-change: transform;
}

.contact-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    transition: background 0.2s;
    border-bottom: 1px solid #f0f0f0;
    min-height: 72px; /* ⭐ FIXED MIN HEIGHT - KEY FIX */
    height: auto;
    background: white;
}

.contact-avatar {
    width: 48px;
    height: 48px;
    min-width: 48px; /* ⭐ Prevent shrinking */
    border-radius: 50%;
    background: var(--whatsapp-green);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
    margin-right: 12px;
    flex-shrink: 0;
}

.contact-info {
    flex: 1;
    min-width: 0;
    overflow: hidden; /* ⭐ Prevent overflow */
}

.contact-name {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
    color: #111;
    line-height: 1.3; /* ⭐ Fixed line height */
}

.contact-last-msg {
    font-size: 13px;
    color: #667781;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3; /* ⭐ Fixed line height */
    min-height: 17px; /* ⭐ Fixed min height */
}

.contact-meta {
    text-align: right;
    flex-shrink: 0;
    min-width: 45px; /* ⭐ Fixed min width for time/badge */
}

.contact-time {
    font-size: 11px;
    color: #667781;
    margin-bottom: 4px;
    white-space: nowrap;
    line-height: 1.3;
    min-height: 14px;
}

.unread-badge {
    background: var(--whatsapp-green);
    color: white;
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 600;
    display: inline-block;
    min-width: 20px; /* ⭐ Fixed min width */
    text-align: center;
}

.contacts-loading {
    text-align: center;
    padding: 20px;
    color: #667781;
    font-size: 13px;
    min-height: 60px; /* ⭐ Fixed height for loading indicator */
}

/* ⭐ Smooth rendering - prevent layout thrashing */
.contact-item {
    transform: translateZ(0); /* Forces GPU acceleration */
    backface-visibility: hidden;
}

/* ⭐ Skeleton loading effect while data loads */
.contact-item.loading .contact-avatar {
    background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: loadingShimmer 1.5s infinite;
}

.contact-item.loading .contact-name,
.contact-item.loading .contact-last-msg,
.contact-item.loading .contact-time {
    background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: loadingShimmer 1.5s infinite;
    color: transparent;
    border-radius: 4px;
}

@keyframes loadingShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}
    .chat-area {
      flex: 1;

      flex-direction: column;
      background: var(--chat-bg);

    }

    .chat-header {

    .messages-container {

    .message-bubble.sent {

    .message-bubble.received {

    .message-text {

    .message-meta {

    .message-time {

    .message-tick {

    .message-tick.sent { color: #8696a0; }

    .message-tick.read { color: #34B7F1; font-weight: bold; }

    .message-image {
      max-width: 250px;
      max-height: 250px;
      border-radius: 8px;
      cursor: pointer;
      display: block;
    }

    .message-video {
      max-width: 250px;
      border-radius: 8px;
      cursor: pointer;
      display: block;
    }

    .message-audio {
      width: 250px;
      margin: 4px 0;
      display: block;
    }

    .message-document {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #f0f0f0;
      border-radius: 8px;
      text-decoration: none;
      max-width: 260px;
    }

    .composer {
      background: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #e9ecef;
      flex-shrink: 0;
    }

    .composer-input {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--sidebar-bg);
      border-radius: 24px;
      padding: 8px 16px;
    }

    .composer-input input {
      flex: 1;
      border: none;
      background: none;
      outline: none;
      font-size: 14px;
    }

    .composer button {
      background: var(--whatsapp-green);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
    }

    .file-preview {
      background: white;
      padding: 8px 20px;
      border-top: 1px solid #e9ecef;
      display: none;
      flex-shrink: 0;
    }

    .file-preview.show {
      display: block;
    }

    .typing-indicator {
      padding: 8px 20px;
      font-size: 12px;
      color: #667781;
      font-style: italic;
      flex-shrink: 0;
    }

    .media-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      display: none;
      z-index: 2000;
      overflow: auto;
    }

    .media-modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-content {
      position: relative;
      width: 100%;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .media-content img {
      max-width: 100%;
      width: auto;
      height: auto;
      max-height: 90vh;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      border-radius: 8px;
    }

    .media-content video {
      max-width: 100%;
      max-height: 90vh;
      width: auto;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 8px;
    }

    .modal-close {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 2001;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .modal-close:hover {
      background: rgba(0,0,0,0.9);
    }
#modalImage {
  max-width: 100%;

}

    .loading, .empty-state {

    .notification {

    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }

    }

    .notification.success { background: var(--whatsapp-green); }

    .load-older-container {

    .load-older-btn {

    }

    .load-older-btn:hover {

    }

    .date-separator {

    .date-separator span {

    .document-download {

<body>
  <div class="chat-container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h4><i class="fab fa-whatsapp"></i> SMSquare Chats</h4>
      </div>
      <div class="chat-tabs">
        <div class="chat-tab active" data-filter="all" onclick="switchTab('all')">All</div>
        <div class="chat-tab" data-filter="unread" onclick="switchTab('unread')">
          Unread
          <span class="badge" id="unreadCountBadge" style="display: none;">0</span>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search contacts..." autocomplete="off">
      </div>
      <div class="contact-list" id="contactList">
        <div class="loading">Loading contacts...</div>
      </div>
    </div>

    <div class="chat-area" id="chatArea" style="display: none;">
      <div class="chat-header">
        <button class="chat-header-back" id="backBtn"><i class="fas fa-arrow-left"></i></button>
        <div class="chat-header-avatar" id="headerAvatar">👤</div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="headerName">Select a chat</div>
          <div class="chat-header-status" id="headerStatus"></div>
        </div>
      </div>

      <div class="messages-container" id="messagesContainer">
        <div class="empty-state">Select a contact to start chatting</div>
      </div>

      <div class="typing-indicator" id="typingIndicator" style="display: none;">Typing...</div>

      <div class="composer" style="display: none;">
        <div class="composer-input">
          <button id="attachBtn"><i class="fas fa-paperclip"></i></button>
          <input type="text" id="messageInput" placeholder="Type a message...">
        </div>
        <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        <input type="file" id="mediaInput" style="display: none;" accept="image/*,video/*,audio/*,.pdf,.doc,.docx">
      </div>

      <div class="file-preview" id="filePreview">
        <div class="preview-card">
          <i class="fas fa-file"></i>
          <div class="preview-info">No file selected</div>
          <button class="preview-cancel" onclick="cancelFile()">✖</button>
        </div>
      </div>
    </div>
  </div>

  <div id="mediaModal" class="media-modal">
    <button class="modal-close" onclick="closeMediaModal()">×</button>
    <div id="mediaContent"></div>
  </div>

  <script>
    // Configuration
    const CSRF = document.querySelector('meta[name="csrf-token"]').content;
    let ws = null;
    let selectedMobile = null;
    let contacts = [];
    let messages = [];
    let isLoadingMessages = false;

    function showNotification(message, type = 'info') {
      const existing = document.querySelector('.notification');
      if (existing) existing.remove();

      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
      document.body.appendChild(notification);

      setTimeout(() => {
        notification.remove();
      }, 3000);
    }

    async function downloadDocument(url, filename, event) {
      if (event) {
        event.stopPropagation();
      }

      try {
        showNotification(`Downloading ${filename}...`, 'info');

        const response = await fetch(url);
        if (!response.ok) throw new Error('Download failed');

        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(blobUrl);

        showNotification(`Downloaded ${filename} successfully!`, 'success');
      } catch (error) {
        console.error('Download error:', error);
        window.open(url, '_blank');
      }
    }

    function connectWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${scheme}://${location.host}/ws/chat_spl/`);

      ws.onopen = () => {
        console.log('WebSocket connected');
        reconnectAttempts = 0;
        showNotification('Connected to chat server', 'success');
        lastProcessedPage = 0;
        contactPage = 1;
        contacts = [];
        loadContacts();
      };

      ws.onmessage = (e) => {
        try {
          handleWebSocketMessage(JSON.parse(e.data));
        } catch (err) {
          console.error('WebSocket parse error:', err);
        }
      };

      ws.onclose = () => {
        console.log('WebSocket disconnected');
        showNotification('Disconnected from server, reconnecting...', 'info');

        setTimeout(() => {
          if (reconnectAttempts < 10) {
            reconnectAttempts++;
            connectWebSocket();
          }
        }, 3000);
      };
      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        showNotification('Connection error', 'error');
      };
    }

    function sendWS(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
      } else {
        console.warn('WebSocket not connected');
      }
    }

    function isSameDay(date1, date2) {
      return date1.getDate() === date2.getDate() &&
             date1.getMonth() === date2.getMonth() &&
             date1.getFullYear() === date2.getFullYear();
    }

    function formatMessageDate(date) {
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const yesterdayDate = new Date(yesterday.getFullYear(), yesterday.getMonth(), yesterday.getDate());
      const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

      if (msgDate.getTime() === todayDate.getTime()) {
        return 'Today';
      } else if (msgDate.getTime() === yesterdayDate.getTime()) {
        return 'Yesterday';
      } else {
        const options = {
          day: 'numeric',
          month: 'long',
          year: date.getFullYear() !== today.getFullYear() ? 'numeric' : undefined
        };
        return date.toLocaleDateString('en-IN', options);
      }
    }

function renderMessages(messagesData, hasMore, nextCursorDateParam, isInitial = false) {
    if (messagesData.length === 0 && messages.length === 0) {
        messagesContainer.innerHTML = '<div class="empty-state">No messages yet</div>';
        return;
    }

    hasMoreMessages = hasMore;
    nextCursorDate = nextCursorDateParam;

    console.log(`📊 renderMessages - hasMore: ${hasMore}, nextCursorDate: ${nextCursorDate}, messagesCount: ${messagesData.length}, isInitial: ${isInitial}`);

    const sortedMessages = [...messagesData].sort((a, b) => new Date(a.sent_at) - new Date(b.sent_at));

    let newMessages = [];

    if (isInitial || messages.length === 0) {
        // First load - replace all messages
        newMessages = sortedMessages;
    } else {
        // Remove duplicates by message_id
        const existingIds = new Set(messages.map(m => m.message_id || m.id));
        const uniqueNewMessages = sortedMessages.filter(m => !existingIds.has(m.message_id || m.id));

        console.log(`📊 Filtered out ${sortedMessages.length - uniqueNewMessages.length} duplicate messages`);

        // Prepend new messages to existing
        newMessages = [...uniqueNewMessages, ...messages];
    }

    let lastDate = null;
    let html = '';

    for (const msg of newMessages) {
        const msgDate = new Date(msg.sent_at);
        const currentDateLabel = formatMessageDate(msgDate);

        if (lastDate !== currentDateLabel) {
            html += `<div class="date-separator"><span>${currentDateLabel}</span></div>`;
            lastDate = currentDateLabel;
        }

        html += renderMessage(msg);
    }

    if (isInitial || messages.length === 0) {
        // First load - replace all messages
        messages = newMessages;
        messagesContainer.innerHTML = html;
        if (hasMoreMessages) {
            addLoadOlderButton();
        } else {
            removeLoadOlderButton();
        }
        scrollToBottom();
    } else {
        // Loading older messages - preserve scroll position
        const oldScrollHeight = messagesContainer.scrollHeight;

        messages = newMessages;
        messagesContainer.innerHTML = html;

        // Calculate new scroll position
        const newScrollHeight = messagesContainer.scrollHeight;
        messagesContainer.scrollTop = newScrollHeight - oldScrollHeight;

        if (hasMoreMessages) {
            addLoadOlderButton();
        } else {
            removeLoadOlderButton();
        }
    }
    isLoadingMessages = false;
}
 function renderMessage(msg) {

    function appendMessage(msg) {
      const wasAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 100;

      let needDateSeparator = false;
      let newDateLabel = null;

      if (messages.length > 0) {
        const lastMsg = messages[messages.length - 1];
        const lastMsgDate = new Date(lastMsg.sent_at);
        const newMsgDate = new Date(msg.sent_at);

        if (!isSameDay(lastMsgDate, newMsgDate)) {
          needDateSeparator = true;
          newDateLabel = formatMessageDate(newMsgDate);
        }
      } else {
        needDateSeparator = true;
        newDateLabel = formatMessageDate(new Date(msg.sent_at));

      messages.push(msg);

      let newHtml = '';
      if (needDateSeparator) {
        newHtml = `<div class="date-separator"><span>${newDateLabel}</span></div>`;

      messagesContainer.insertAdjacentHTML('beforeend', newHtml);

        });
    } else {
        console.log('❌ No messages to load older from');
        isLoadingMessages = false;
    }
}
    function scrollToBottom() {
      setTimeout(() => messagesContainer.scrollTop = messagesContainer.scrollHeight, 100);
    }

    // ============================================
    // SEND MESSAGE
    // ============================================
    async function sendMessage() {
      const text = messageInput.value.trim();
      const file = mediaInput.files[0];

      if (!selectedMobile) {
        showNotification('Select a contact first', 'error');
        return;
      }
      if (!text && !file){
        showNotification('Enter a message or select a file', 'error');
        return;
      }

      if (file) {
        const fileSizeMB = file.size / (1024 * 1024);
        const fileType = file.type.split('/')[0];

        let maxSize = 16;
        if (fileType === 'image') maxSize = 5;
        if (fileType === 'video') maxSize = 16;
        if (fileType === 'audio') maxSize = 16;

        if (fileSizeMB > maxSize) {
          showNotification(`File too large! ${fileType} must be under ${maxSize}MB. Yours is ${fileSizeMB.toFixed(2)}MB`, 'error');
          mediaInput.value = '';
          cancelFile();
          return;
        }
      }

      const originalBtnHtml = sendBtn.innerHTML;
      sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      sendBtn.disabled = true;

      try {
        if (file) {
          const formData = new FormData();
          formData.append('mobile', selectedMobile);
          formData.append('text', text);
          formData.append('media', file);
          showNotification(`Uploading ${file.name} (${(file.size / (1024*1024)).toFixed(2)}MB)...`, 'info');

          const response = await fetch('/api/send-reply/', {
            method: 'POST',
            headers: { 'X-CSRFToken': CSRF },
            body: formData
          });
          const result = await response.json();
          if (result.status === 'ok') {
            showNotification('Message sent successfully!', 'success');
            messageInput.value = '';
            mediaInput.value = '';
            cancelFile();
          }
        } else if (text) {
          sendWS({ type: 'send_message', mobile: selectedMobile, text: text, content_type: 'text' });
          messageInput.value = '';
          showNotification('Message sent!', 'success');
        }
      } catch (error) {
        console.error('Send error:', error);
        showNotification(`Error: ${error.message}`, 'error');
      } finally {
        sendBtn.innerHTML = originalBtnHtml;
        sendBtn.disabled = false;
      }
    }

    function onTyping() {
      if (!selectedMobile) return;
      sendWS({ type: 'typing', mobile: selectedMobile, state: true });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        sendWS({ type: 'typing', mobile: selectedMobile, state: false });
      }, 1000);
    }

    function cancelFile() {
      mediaInput.value = '';
      filePreview.classList.remove('show');
      document.querySelector('.preview-info').textContent = 'No file selected';
    }

    // ============================================
    // MEDIA & UTILITIES
    // ============================================

let zoomLevel = 1;

function openMedia(src, type) {
  const modal = document.getElementById('mediaModal');
  const content = document.getElementById('mediaContent');

  if (type === 'image') {
    content.innerHTML = `
      <img id="modalImage" src="${src}"
        style="max-width: 100%; max-height: 90vh; object-fit: contain; transform: scale(1); transition: transform 0.2s; cursor: zoom-in;">
    `;

    zoomLevel = 1;

    const img = document.getElementById('modalImage');

    img.style.pointerEvents = "auto";

    img.onwheel = function(e) {
      e.preventDefault();

      if (e.deltaY < 0) {
        zoomLevel += 0.1;
      } else {
        zoomLevel -= 0.1;
      }

      zoomLevel = Math.max(0.5, Math.min(zoomLevel, 3));
      img.style.transform = `scale(${zoomLevel})`;
    };

    img.ondblclick = function() {
      zoomLevel = zoomLevel === 1 ? 2 : 1;
      img.style.transform = `scale(${zoomLevel})`;
    };

  } else {
    content.innerHTML = `
      <video src="${src}" controls autoplay
        style="max-width: 100%; max-height: 90vh;">
      </video>
    `;
  }

  modal.classList.add('show');
}
    function closeMediaModal() {
      document.getElementById('mediaModal').classList.remove('show');
      document.getElementById('mediaContent').innerHTML = '';
zoomLevel = 1;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

 function formatTime(isoString) {
      const date = new Date(isoString);
      const now = new Date();
      const diff = now - date;
      if (diff < 86400000) {
        return date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      } else if (diff < 604800000) {
        return date.toLocaleDateString('en-IN', { weekday: 'short' });
      } else {
        return date.toLocaleDateString('en-IN', { day: '2-digit', month: '2-digit' });
      }
    }

    // ============================================
    // HANDLE WEBSOCKET MESSAGES
    // ============================================
    function handleWebSocketMessage(data) {
      console.log('📨 WebSocket message received:', data.type);

      switch (data.type) {
        case 'contacts.page':
          renderContacts(data.contacts, data.page === 1, data.unread_count, data.has_more, data.page);
          break;

        case 'messages.page':
          console.log('📥 ========== MESSAGES.PAGE RECEIVED ==========');
          console.log('📥 Mobile from server:', data.mobile);
          console.log('📥 Current selected:', selectedMobile);
          console.log('📥 Messages count:', data.messages ? data.messages.length : 0);
          console.log('📥 Debug count:', data.debug_count);
          console.log('📥 Has more:', data.has_more);
          console.log('📥 Full data:', data);

          if (data.messages && data.messages.length > 0) {
            console.log('📥 First message:', data.messages[0]);
          }

          if (data.mobile === selectedMobile) {
            console.log('✅ Mobile matches, rendering messages...');
            if (data.messages && data.messages.length > 0) {
              renderMessages(data.messages, data.has_more, data.next_cursor_date, data.is_initial === true || messages.length === 0);
            } else {
              console.log('⚠️ No messages in response');
              messagesContainer.innerHTML = '<div class="empty-state">No messages found (but DB has data - check console)</div>';
            }
          } else {
            console.log('❌ Mobile mismatch! Server:', data.mobile, 'Selected:', selectedMobile);
          }
          break;

        case 'new.message':
          if (data.message.mobile === selectedMobile) {
            appendMessage(data.message);
          }
          updateContactInList(data.message);
          break;

        case 'delivery.update':
          console.log('📬 Delivery update received:', data.message_id, data.status);
          updateMessageTickImproved(data.message_id, data.status);
          if (data.mobile) updateContactStatus(data.mobile, data.status);
          break;

        case 'unread.update':
          if (data.unread_count !== undefined) {
            totalUnreadCount = data.unread_count;
            const badge = document.getElementById('unreadCountBadge');
            if (badge) {
              if (totalUnreadCount > 0) {
                badge.style.display = 'inline';
                badge.textContent = totalUnreadCount;
              } else {
                badge.style.display = 'none';
              }
            }
            if (currentFilter === 'unread') loadContacts(1);
          }
          break;

        case 'contact.update':
          if (data.contact) {
            const existingContact = contacts.find(c => c.mobile === data.contact.mobile);
            if (existingContact && !data.contact.last_time) {
              data.contact.last_time = existingContact.last_time;
            }
            updateContactInList(data.contact);
          }
          break;

        case 'typing':
          if (data.mobile === selectedMobile) {
            typingIndicator.style.display = data.state ? 'block' : 'none';
          }
          break;

        case 'joined':
          console.log('Joined chat:', data.mobile);
          break;

        case 'marked_read':
          console.log('Marked read:', data.mobile);
          break;

        case 'error':
          console.error('WebSocket error:', data.message);
          showNotification(data.message, 'error');
          break;
      }
    }

    // ============================================
    // EVENT LISTENERS
    // ============================================
    sendBtn.onclick = sendMessage;
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    messageInput.addEventListener('input', onTyping);
    attachBtn.onclick = () => mediaInput.click();
    backBtn.onclick = () => {
      document.getElementById('sidebar').classList.remove('hide');
      chatArea.style.display = 'none';
    };

    mediaInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        filePreview.classList.add('show');
        document.querySelector('.preview-info').textContent = file.name;
      }
    });

    searchInput.addEventListener('input', (e) => {
      clearTimeout(window.searchTimeout);
      window.searchTimeout = setTimeout(() => {
        if (e.target.value.trim()) {
          searchContacts(e.target.value.trim());
        } else {
          contactPage = 1;
          contacts = [];
          hasMoreContacts = true;
          lastProcessedPage = 0;
          loadContacts(1);
        }
      }, 300);
    });

    contactListEl.addEventListener('scroll', handleContactsScroll);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMediaModal();
    });

    document.getElementById('mediaModal').addEventListener('click', function(e) {
      if (e.target === this) closeMediaModal();
    });

    connectWebSocket();

      document.addEventListener('contextmenu', function(event) {
      event.preventDefault();
      showNotification('Right-click is disabled on this page', 'warning');
      return false;
  });

  // Update the showNotification function to include warning style
function showNotification(message, type = 'info') {
    const existing = document.querySelector('.notification');
    if (existing) existing.remove();

    const notification = document.createElement('div');
    let icon = 'fa-info-circle';
    if (type === 'success') icon = 'fa-check-circle';
    else if (type === 'error') icon = 'fa-exclamation-circle';
    else if (type === 'warning') icon = 'fa-exclamation-triangle';

    notification.className = `notification ${type}`;
    notification.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
    document.body.appendChild(notification);

    setTimeout(() => {
        notification.remove();
    }, 3000);
}
  </script>
